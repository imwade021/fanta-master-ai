<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10141c">
<title>Banco — asta fantacalcio</title>
<style>
:root{
  --fondo:#10141c; --carta:#1a2029; --rilievo:#222a35; --linea:#2c3542;
  --testo:#e9ecf1; --fioco:#8b94a3; --tenue:#5d6674;
  --oro:#f0b429; --allarme:#e06c5b; --verde:#6fbf9b; --acqua:#63a8c9;
  --raggio:14px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--fondo); color:var(--testo); font-family:var(--sans);
  font-size:15px; line-height:1.45; padding-bottom:calc(74px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* ---------- testata ---------- */
header{
  position:sticky;top:0;z-index:40;background:rgba(16,20,28,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--linea);
  padding-top:env(safe-area-inset-top);
}
.barra{display:flex;align-items:stretch;gap:1px;background:var(--linea);
  border-bottom:1px solid var(--linea)}
.cella{flex:1;background:var(--fondo);padding:9px 10px;text-align:center}
.cella .et{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tenue)}
.cella .vl{font-family:var(--mono);font-size:17px;font-weight:600;
  font-variant-numeric:tabular-nums;margin-top:1px}

/* ---------- schede ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(16,20,28,.97);backdrop-filter:blur(12px);
  border-top:1px solid var(--linea);display:flex;
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{flex:1;padding:13px 4px 14px;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--tenue);border-top:2px solid transparent}
nav button.on{color:var(--oro);border-top-color:var(--oro)}

/* ---------- il numero ---------- */
.banco{background:var(--carta);border:1px solid var(--linea);border-radius:var(--raggio);
  margin:14px 0;overflow:hidden}
.ruoli{display:flex;gap:1px;background:var(--linea)}
.ruoli button{flex:1;background:var(--carta);padding:11px 0;font-size:12px;font-weight:600;
  letter-spacing:.1em;color:var(--tenue)}
.ruoli button.on{background:var(--rilievo);color:var(--testo)}
.ruoli button .mini{display:block;font-size:9.5px;font-weight:400;color:var(--tenue);
  letter-spacing:.04em;margin-top:2px}
.ruoli button.on .mini{color:var(--fioco)}
.ruoli button.pieno{color:var(--verde)}

.cifra{padding:22px 18px 16px;text-align:center}
.cifra .et{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--fioco)}
.cifra .n{font-family:var(--mono);font-size:66px;font-weight:700;line-height:.94;
  color:var(--oro);font-variant-numeric:tabular-nums;letter-spacing:-.04em;margin:6px 0 2px;
  transition:color .18s}
.cifra.rosso .n{color:var(--allarme)}
.cifra .sotto{font-size:13px;color:var(--fioco);margin-top:6px}
.cifra .sotto b{color:var(--testo);font-weight:600}

/* barra di cassa */
.cassa{display:flex;height:7px;margin:2px 14px 0;border-radius:4px;overflow:hidden;
  background:var(--rilievo)}
.cassa i{display:block;height:100%}
.legenda{display:flex;justify-content:space-between;padding:7px 14px 14px;
  font-size:10.5px;color:var(--tenue)}
.legenda span{display:flex;align-items:center;gap:5px}
.pallino{width:7px;height:7px;border-radius:2px;display:inline-block}

/* ---------- griglia caselle ---------- */
.sez{margin:18px 0 8px;display:flex;align-items:baseline;justify-content:space-between}
.sez h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--fioco);
  margin:0;font-weight:600}
.sez .nota{font-size:11px;color:var(--tenue)}

.riga{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--carta);
  border:1px solid var(--linea);border-radius:10px;margin-bottom:7px}
.riga .rl{width:26px;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--fioco);
  flex:none;text-align:center}
.caselle{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.cs{min-width:30px;height:26px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;
  padding:0 5px}
.cs.presa{background:rgba(111,191,155,.16);color:var(--verde);
  border:1px solid rgba(111,191,155,.3);font-weight:600}
.cs.vuota{background:var(--rilievo);color:var(--tenue);border:1px solid var(--linea)}
.riga .tot{font-family:var(--mono);font-size:12px;color:var(--fioco);flex:none;
  font-variant-numeric:tabular-nums}

/* ---------- pulsanti ---------- */
.azioni{display:flex;gap:8px;margin:14px 0}
.btn{flex:1;padding:14px 10px;border-radius:11px;font-size:13.5px;font-weight:600;
  text-align:center;border:1px solid var(--linea);background:var(--carta)}
.btn.primo{background:var(--oro);color:#171307;border-color:var(--oro)}
.btn.spento{color:var(--fioco)}
.btn:active{transform:scale(.98)}

.avviso{border-radius:11px;padding:11px 13px;font-size:13px;margin:12px 0;
  border:1px solid rgba(224,108,91,.4);background:rgba(224,108,91,.1);color:#f2b3a8}
.avviso b{color:var(--allarme)}
.avviso.calmo{border-color:rgba(99,168,201,.35);background:rgba(99,168,201,.09);color:#bcd9e6}

/* ---------- listone ---------- */
.filtri{position:sticky;top:0;z-index:20;background:var(--fondo);padding:10px 0 8px}
.cerca{width:100%;padding:11px 13px;border-radius:10px;background:var(--carta);
  border:1px solid var(--linea);font-size:15px}
.cerca::placeholder{color:var(--tenue)}
.chip{display:flex;gap:5px;margin-top:8px;overflow-x:auto;padding-bottom:2px;
  scrollbar-width:none}
.chip::-webkit-scrollbar{display:none}
.chip button{padding:6px 11px;border-radius:20px;font-size:11.5px;white-space:nowrap;
  border:1px solid var(--linea);background:var(--carta);color:var(--fioco)}
.chip button.on{background:var(--rilievo);color:var(--testo);border-color:var(--tenue)}

.g{display:flex;align-items:center;gap:10px;padding:10px 11px;border-bottom:1px solid var(--linea)}
.g.via{opacity:.34}
.g .id{flex:1;min-width:0}
.g .nm{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.g .sq{font-size:11px;color:var(--tenue);margin-top:1px;display:flex;gap:6px;
  align-items:center;flex-wrap:wrap}
.g .pz{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--oro);
  font-variant-numeric:tabular-nums;flex:none;text-align:right;min-width:38px}
.g .pz small{display:block;font-size:9.5px;color:var(--tenue);font-weight:400}
.tag{font-size:9.5px;padding:1.5px 5px;border-radius:4px;letter-spacing:.04em;
  border:1px solid var(--linea);color:var(--fioco);white-space:nowrap}
.tag.f1{border-color:rgba(240,180,41,.5);color:var(--oro)}
.tag.rig{border-color:rgba(99,168,201,.5);color:var(--acqua)}
.tag.buono{border-color:rgba(111,191,155,.5);color:var(--verde)}
.tag.ignoto{border-color:rgba(224,108,91,.45);color:var(--allarme)}
.barrina{width:34px;height:4px;border-radius:2px;background:var(--rilievo);
  overflow:hidden;flex:none}
.barrina i{display:block;height:100%;background:var(--verde)}

/* ---------- foglio ---------- */
.velo{position:fixed;inset:0;z-index:60;background:rgba(8,10,14,.72);
  display:flex;align-items:flex-end;justify-content:center;
  animation:sfuma .16s ease}
@keyframes sfuma{from{opacity:0}to{opacity:1}}
.foglio{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  background:var(--carta);border-radius:18px 18px 0 0;border-top:1px solid var(--linea);
  padding:8px 16px calc(22px + env(safe-area-inset-bottom));
  animation:sali .22s cubic-bezier(.2,.8,.3,1)}
@keyframes sali{from{transform:translateY(28px)}to{transform:translateY(0)}}
.maniglia{width:38px;height:4px;border-radius:2px;background:var(--linea);margin:6px auto 14px}
.foglio h3{margin:0 0 2px;font-size:21px}
.foglio .oc{font-size:12.5px;color:var(--fioco);margin-bottom:14px}

.fatti{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--linea);
  border:1px solid var(--linea);border-radius:10px;overflow:hidden;margin-bottom:12px}
.fatto{background:var(--carta);padding:9px 8px;text-align:center}
.fatto .et{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
.fatto .vl{font-family:var(--mono);font-size:16px;font-weight:600;margin-top:2px;
  font-variant-numeric:tabular-nums}
.prosa{font-size:13px;color:var(--fioco);line-height:1.55;margin:10px 0}
.prosa b{color:var(--testo);font-weight:600}

.spesa{display:flex;align-items:center;gap:9px;margin:14px 0 6px}
.spesa input{flex:1;padding:13px;border-radius:10px;background:var(--rilievo);
  border:1px solid var(--linea);font-family:var(--mono);font-size:19px;text-align:center;
  font-variant-numeric:tabular-nums}
.spesa button{width:46px;height:46px;border-radius:10px;background:var(--rilievo);
  border:1px solid var(--linea);font-size:20px;color:var(--fioco);flex:none}

/* ---------- piano ---------- */
.campo{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;
  background:var(--carta);border:1px solid var(--linea);border-radius:10px;margin-bottom:7px}
.campo label{font-size:13.5px}
.campo .aiuto{font-size:11px;color:var(--tenue);margin-top:2px}
.campo input,.campo select{width:82px;padding:8px;border-radius:8px;background:var(--rilievo);
  border:1px solid var(--linea);font-family:var(--mono);text-align:center;font-size:15px}
.campo select{width:auto;font-family:var(--sans);font-size:13px;text-align:left}

.fasciera{background:var(--carta);border:1px solid var(--linea);border-radius:10px;
  padding:11px 12px;margin-bottom:7px}
.fasciera .cap{display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:9px}
.fasciera .cap b{font-size:14px}
.fasciera .cap span{font-family:var(--mono);font-size:12.5px;color:var(--fioco)}
.livello{display:flex;align-items:center;gap:9px;padding:5px 0}
.livello .nome{flex:1;font-size:12.5px;color:var(--fioco)}
.livello .nome i{font-style:normal;color:var(--tenue);font-size:11px}
.livello .cnt{font-family:var(--mono);font-size:15px;width:22px;text-align:center;
  font-variant-numeric:tabular-nums}
.livello button{width:30px;height:30px;border-radius:8px;background:var(--rilievo);
  border:1px solid var(--linea);color:var(--fioco);font-size:16px;line-height:1}

.piede{font-size:11.5px;color:var(--tenue);line-height:1.6;margin:20px 0 8px;
  padding-top:14px;border-top:1px solid var(--linea)}
.vuoto{text-align:center;color:var(--tenue);font-size:13px;padding:34px 20px;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="barra">
    <div class="cella"><div class="et">Cassa</div><div class="vl" id="hCassa">—</div></div>
    <div class="cella"><div class="et">Caselle</div><div class="vl" id="hCaselle">—</div></div>
    <div class="cella"><div class="et">Inflazione</div><div class="vl" id="hInfl">—</div></div>
  </div>
</header>

<main class="wrap" id="vista"></main>

<nav>
  <button data-t="asta" class="on">Asta</button>
  <button data-t="listone">Listone</button>
  <button data-t="piano">Piano</button>
</nav>

,"q":2},{"id":7338,"n":"Albarracin","r":"A","s":"Cagliari","p":1,"f":5,"c":32,"nc":"solo 2 presenze in Serie A","y":6.47,"pv":2,"mv":6.0,"fm":6.0,"g":0,"a":0,"rig":null,"v":0.14,"vc":-14,"q":1},{"id":7317,"n":"Trepy","r":"A","s":"Cagliari","p":1,"f":5,"c":19,"nc":"solo 3 presenze in Serie A","y":6.33,"pv":3,"mv":5.67,"fm":5.67,"g":0,"a":0,"rig":null,"v":0.0,"vc":-27,"q":1},{"id":7027,"n":"Azon","r":"A","s":"Como","p":1,"f":5,"c":null,"nc":"nessuno storico utile","y":null,"pv":0,"mv":null,"fm":null,"g":0,"a":0,"rig":null,"v":null,"vc":null,"q":1},{"id":6981,"n":"Vaz","r":"A","s":"Roma","p":1,"f":5,"c":28,"nc":"solo 7 presenze in Serie A","y":6.48,"pv":7,"mv":5.93,"fm":6.36,"g":1,"a":0,"rig":null,"v":0.15,"vc":-18,"q":1},{"id":7158,"n":"Moro L.","r":"A","s":"Sassuolo","p":1,"f":5,"c":23,"nc":"solo 6 presenze in Serie A","y":6.12,"pv":6,"mv":5.58,"fm":5.5,"g":0,"a":0,"rig":null,"v":-0.21,"vc":-23,"q":1},{"id":7161,"n":"Bayo V.","r":"A","s":"Udinese","p":1,"f":5,"c":39,"nc":"gioca, ma non sempre dall'inizio","y":6.13,"pv":12,"mv":5.75,"fm":5.83,"g":0,"a":1,"rig":null,"v":-0.2,"vc":-7,"q":1},{"id":7408,"n":"Lisman","r":"A","s":"Venezia","p":1,"f":5,"c":null,"nc":"nessuno storico utile","y":null,"pv":0,"mv":null,"fm":6.13,"g":0,"a":0,"rig":null,"v":null,"vc":null,"q":1},{"id":7482,"n":"Lauberbach","r":"A","s":"Venezia","p":1,"f":5,"c":null,"nc":"nessuno storico utile","y":null,"pv":0,"mv":null,"fm":6.8,"g":0,"a":0,"rig":null,"v":null,"vc":null,"q":1}]}</script>
<script>
"use strict";
const DATI = JSON.parse(document.getElementById('dati').textContent);
const RUOLI = ['P','D','C','A'];
const NOME_RUOLO = {P:'Portieri', D:'Difensori', C:'Centrocampisti', A:'Attaccanti'};
// Quanti se ne schierano davvero ogni domenica. Serve a impedire al piano di
// proporre tre portieri da titolare: il secondo e il terzo non giocano mai, e
// i crediti spesi li' sono crediti buttati.
const IN_CAMPO = {P:1, D:3, C:4, A:3};
const CHIAVE = 'banco:stato:v1';

/* ============================================================ MEMORIA
   L'asta dura due ore e il telefono si blocca. Lo stato si salva a ogni
   tocco, su qualunque deposito il browser conceda; se non ne concede
   nessuno resta in memoria e il pulsante di esportazione diventa
   l'unica rete. Non si perde niente in silenzio. */
const Deposito = (() => {
  let cache = null;
  const prova = async (fn, fallback) => { try { return await fn(); } catch (e) { return fallback; } };
  return {
    async leggi() {
      if (typeof window.storage !== 'undefined') {
        const r = await prova(() => window.storage.get(CHIAVE), null);
        if (r && r.value) return JSON.parse(r.value);
      }
      const l = await prova(() => localStorage.getItem(CHIAVE), null);
      if (l) return JSON.parse(l);
      return cache;
    },
    async scrivi(o) {
      cache = o;
      const testo = JSON.stringify(o);
      if (typeof window.storage !== 'undefined') {
        await prova(() => window.storage.set(CHIAVE, testo), null);
      }
      await prova(() => localStorage.setItem(CHIAVE, testo), null);
    }
  };
})();

/* ============================================================ STATO */
const PIANI = {
  corazzata:  {quota:{P:.05, D:.15, C:.30, A:.50}, cima:+1,
               desc:'due o tre nomi grossi, il resto a un credito'},
  equilibrata:{quota:{P:.07, D:.20, C:.32, A:.41}, cima:0,
               desc:'un titolare per reparto, poi si scala'},
  spalmata:   {quota:{P:.09, D:.26, C:.34, A:.31}, cima:-1,
               desc:'nessun buco, nessun campione'}
};

let S = {
  budget: DATI.budget, squadre: DATI.squadre,
  slot: Object.assign({}, DATI.slot),
  piano: null,             // {ruolo:[fascia per casella ancora libera]}
  strategia: 'equilibrata',
  regola: 'basso',
  priorita: ['P','D','C','A'],   // chi paga per primo, dal meno prezioso
  miei: [], venduti: {},
  ruoloAttivo: 'A'
};
let scheda = 'asta', filtro = {testo:'', ruolo:'', soloLiberi:true, ordine:'p'};

const INDICE = {};
DATI.giocatori.forEach(g => INDICE[g.id] = g);

/* ============================================================ MOTORE
   Tutta l'aritmetica sta qui e non guarda niente fuori: nessuna rete,
   nessuna stima. Stessi acquisti, stesso risultato, sempre. */

function rif(ruolo, fascia) {
  const r = (DATI.rotture[ruolo] || []).find(x => x.fascia === fascia);
  return r ? Math.max(1, r.rif) : 1;
}

/* Quanto sta pagando la stanza rispetto al listino. Si misura sui prezzi
   gridati ad alta voce - i miei e quelli degli altri - senza sapere né
   volere sapere di chi sia la squadra che li ha presi. */
function inflazione() {
  let pagato = 0, atteso = 0, n = 0;
  const conta = (id, prezzo) => {
    const g = INDICE[id];
    if (!g || g.p < 3) return;          // sotto i tre crediti il rapporto impazzisce
    pagato += prezzo; atteso += g.p; n++;
  };
  S.miei.forEach(a => conta(a.id, a.prezzo));
  Object.entries(S.venduti).forEach(([id, p]) => conta(+id, p));
  if (n < 8 || atteso <= 0) return {valore:1, campione:n, pronta:false};
  return {valore: pagato / atteso, campione:n, pronta:true};
}

function rifVivo(ruolo, fascia, infl) {
  return Math.max(1, Math.round(rif(ruolo, fascia) * infl));
}

/* Le caselle ancora da riempire, con la fascia che il piano le assegna. */
function residue(ruolo) { return (S.piano && S.piano[ruolo]) ? S.piano[ruolo].slice() : []; }

function impegno(ruolo, infl, salta) {
  const lista = residue(ruolo);
  let somma = 0;
  lista.forEach((f, i) => { if (i !== salta) somma += rifVivo(ruolo, f, infl); });
  return somma;
}

function quadro() {
  const infl = inflazione();
  const speso = S.miei.reduce((t, a) => t + a.prezzo, 0);
  const cassa = S.budget - speso;
  const caselle = {}; let vuoteTot = 0, impegnoTot = 0;
  RUOLI.forEach(r => {
    const res = residue(r);
    caselle[r] = {vuote: res.length, fasce: res, impegno: impegno(r, infl.valore, -1)};
    vuoteTot += res.length; impegnoTot += caselle[r].impegno;
  });
  return {infl, speso, cassa, caselle, vuoteTot, impegnoTot,
          scoperto: impegnoTot > cassa};
}

/* Il numero. Quanti crediti sono davvero miei, ora, per questa casella.

   Due vincoli, vale il più stretto:
     1. la cassa meno quello che serve per finire tutto il resto al piano;
     2. il pavimento assoluto - ogni casella che resta costa almeno un
        credito, e quel credito non è spendibile qui.
   Il secondo non si viola mai: è la regola che impedisce di finire l'asta
   con quattro caselle vuote e otto crediti in mano. */
function massimo(ruolo, indiceCasella) {
  const q = quadro();
  const res = residue(ruolo);
  if (!res.length) return {valore:0, piena:true, q};

  const i = (indiceCasella == null) ? 0 : indiceCasella;
  const altre = RUOLI.filter(r => r !== ruolo)
                     .reduce((t, r) => t + q.caselle[r].impegno, 0);
  const stessoRuolo = impegno(ruolo, q.infl.valore, i);

  const perPiano = q.cassa - altre - stessoRuolo;
  const pavimento = q.cassa - (q.vuoteTot - 1);
  const valore = Math.max(1, Math.min(perPiano, pavimento));

  return {
    valore, piena:false, q, fascia:res[i],
    riferimento: rifVivo(ruolo, res[i], q.infl.valore),
    impegnoAltrove: altre + stessoRuolo,
    pavimento, perPiano,
    scoperto: q.scoperto
  };
}

/* ------------------------------------------------------------ ACQUISTO
   Comprare non è togliere crediti: è consumare una casella del piano e
   riequilibrare quelle che restano. Se ho pagato più del riferimento, la
   differenza la deve pagare qualcun altro del piano - e il consulente dice
   esattamente chi, senza chiedermelo. */
function scalaFascia(ruolo, quale) {
  const res = S.piano[ruolo];
  if (res[quale] >= 5) return 0;
  const prima = rif(ruolo, res[quale]);
  res[quale]++;
  return prima - rif(ruolo, res[quale]);
}

function riequilibra(ruolo, avanzo) {
  const mosse = [];
  let mancano = avanzo, giri = 0;
  while (mancano > 0 && giri < 200) {
    giri++;
    let scelta = null;
    if (S.regola === 'basso') {
      // paga la casella più bassa dello stesso reparto; finito il reparto,
      // si va sugli altri seguendo la priorità dichiarata.
      const ordine = [ruolo, ...S.priorita.filter(r => r !== ruolo)];
      for (const r of ordine) {
        const res = S.piano[r] || [];
        let peggiore = -1;
        res.forEach((f, i) => { if (f < 5 && (peggiore < 0 || f > res[peggiore])) peggiore = i; });
        if (peggiore >= 0) { scelta = [r, peggiore]; break; }
      }
    } else if (S.regola === 'reparto') {
      for (const r of S.priorita) {
        const res = S.piano[r] || [];
        let peggiore = -1;
        res.forEach((f, i) => { if (f < 5 && (peggiore < 0 || f > res[peggiore])) peggiore = i; });
        if (peggiore >= 0) { scelta = [r, peggiore]; break; }
      }
    } else {
      // proporzionale: paga chi in questo momento vale di più, così il
      // colpo si spalma invece di svuotare un reparto solo.
      let top = null;
      RUOLI.forEach(r => (S.piano[r] || []).forEach((f, i) => {
        if (f < 5 && (!top || rif(r, f) > rif(top[0], S.piano[top[0]][top[1]]))) top = [r, i];
      }));
      scelta = top;
    }
    if (!scelta) break;
    const recuperato = scalaFascia(scelta[0], scelta[1]);
    if (recuperato <= 0) { if (S.piano[scelta[0]][scelta[1]] >= 5) continue; else break; }
    mancano -= recuperato;
    mosse.push({ruolo:scelta[0], fascia:S.piano[scelta[0]][scelta[1]]});
  }
  return {mosse, residuo: Math.max(0, mancano)};
}

function compra(g, prezzo) {
  const res = S.piano[g.r] || [];
  if (!res.length) return {errore:'Le caselle di questo reparto sono già tutte piene.'};

  // Quale casella sto riempiendo: quella la cui fascia costa più vicino a
  // quanto ho pagato. Se pago 90, sto consumando lo slot da titolare, non
  // uno dei riempitivi.
  const infl = inflazione().valore;
  let quale = 0, scarto = Infinity;
  res.forEach((f, i) => {
    const d = Math.abs(rifVivo(g.r, f, infl) - prezzo);
    if (d < scarto) { scarto = d; quale = i; }
  });

  const fascia = res[quale];
  const riferimento = rifVivo(g.r, fascia, infl);
  res.splice(quale, 1);

  const avanzo = prezzo - riferimento;
  const eco = avanzo > 0 ? riequilibra(g.r, avanzo) : {mosse:[], residuo:0};
  RUOLI.forEach(r => (S.piano[r] || []).sort((a, b) => a - b));

  S.miei.push({id:g.id, nome:g.n, r:g.r, prezzo, fascia});
  delete S.venduti[g.id];
  salva();
  return {fascia, riferimento, avanzo, eco};
}

function annulla(indice) {
  const a = S.miei[indice];
  if (!a) return;
  S.miei.splice(indice, 1);
  // Ricostruire il piano dopo un annullo è più onesto che indovinare quale
  // fascia rimettere: si riparte dal piano teorico e si riconsumano gli
  // acquisti rimasti, in ordine.
  const acquisti = S.miei.slice();
  S.miei = [];
  rigeneraPiano();
  acquisti.forEach(x => { const g = INDICE[x.id]; if (g) compra(g, x.prezzo); });
  salva();
}

/* ------------------------------------------------------------ IL PIANO
   Le fasce non sono percentuali decise a tavolino: sono la fila d'attesa.
   Con dodici squadre, i primi dodici di un ruolo se li spartiscono le
   squadre, uno a testa - quelli sono fascia 1. Il piano dice quante caselle
   voglio a ciascun livello, e si adatta al budget da solo. */
function pianoBase() {
  const p = {};
  RUOLI.forEach(r => { p[r] = new Array(S.slot[r]).fill(5); });
  return p;
}

function costoPiano(p) {
  let t = 0;
  RUOLI.forEach(r => (p[r] || []).forEach(f => t += rif(r, f)));
  return t;
}

/* Tutte le forme possibili di un reparto: quante caselle a ciascuna fascia.
   Con al massimo otto caselle e cinque fasce sono poche centinaia di
   combinazioni - si guardano tutte, invece di indovinare. */
function forme(caselle, fasce, da) {
  da = da || 1;
  if (da === fasce) return [[caselle]];
  const fuori = [];
  for (let q = 0; q <= caselle; q++) {
    forme(caselle - q, fasce, da + 1).forEach(resto => fuori.push([q].concat(resto)));
  }
  return fuori;
}

function rigeneraPiano() {
  const strategia = PIANI[S.strategia];
  const tetto = Math.floor(S.budget * 0.97);
  const p = {};

  RUOLI.forEach(r => {
    const caselle = S.slot[r];
    const quota = Math.floor(tetto * strategia.quota[r]);

    // Si cerca la forma che usa meglio la quota del reparto senza sforarla.
    let migliore = null, spesaTop = 0;
    const candidate = [];
    forme(caselle, 5).forEach(f => {
      let costo = 0;
      f.forEach((q, i) => costo += q * rif(r, i + 1));
      if (costo > quota) return;
      if (f[0] > IN_CAMPO[r]) return;     // niente panchine di fuoriclasse
      candidate.push({f, costo});
      if (costo > spesaTop) spesaTop = costo;
    });

    // Fra quelle che ci vanno vicino, decide la strategia: la corazzata
    // preferisce concentrare in cima, la spalmata distribuire.
    // Fra tutte quelle che usano bene la quota, sceglie la strategia: quanto
    // concentrare in cima invece di spalmare.
    const vicine = candidate.filter(c => c.costo >= spesaTop * 0.80);
    const cima = (x) => x.f[0] * 10 + x.f[1] * 3 + x.f[2];
    vicine.sort((a, b) => {
      const d = (cima(b) - cima(a)) * strategia.cima;
      return d !== 0 ? d : b.costo - a.costo;
    });
    migliore = (vicine[0] || candidate[0] || {f:[0,0,0,0,caselle]}).f;

    const lista = [];
    migliore.forEach((q, i) => { for (let k = 0; k < q; k++) lista.push(i + 1); });
    lista.sort((a, b) => a - b);
    p[r] = lista;
  });

  // Quello che avanza dopo i reparti non si butta: sale dove costa meno.
  for (let giro = 0; giro < 300; giro++) {
    const attuale = costoPiano(p);
    let scelto = null, costo = Infinity;
    RUOLI.forEach(r => p[r].forEach((f, i) => {
      if (f <= 1) return;
      // Vale anche qui: mai piu' titolari veri di quanti se ne schierano.
      if (f === 2 && p[r].filter(x => x === 1).length >= IN_CAMPO[r]) return;
      const c = rif(r, f - 1) - rif(r, f);
      if (c > 0 && c < costo && attuale + c <= tetto) { costo = c; scelto = [r, i]; }
    }));
    if (!scelto) break;
    p[scelto[0]][scelto[1]]--;
    p[scelto[0]].sort((a, b) => a - b);
  }

  S.piano = p;
  return p;
}

/* ============================================================ SALVATAGGIO */
let inSalvataggio = null;
function salva() {
  clearTimeout(inSalvataggio);
  inSalvataggio = setTimeout(() => Deposito.scrivi(S), 120);
}

async function ripristina() {
  const o = await Deposito.leggi();
  if (o && o.miei) {
    S = Object.assign(S, o);
    if (!S.piano) rigeneraPiano();
  } else {
    rigeneraPiano();
  }
}

/* ============================================================ VISTE */
const E = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c;
  if (h != null) n.innerHTML = h; return n; };
const $ = s => document.querySelector(s);

function disegna() {
  const q = quadro();
  $('#hCassa').textContent = q.cassa;
  $('#hCaselle').textContent = q.vuoteTot;
  $('#hInfl').textContent = q.infl.pronta
    ? (q.infl.valore >= 1 ? '+' : '') + Math.round((q.infl.valore - 1) * 100) + '%'
    : '—';
  $('#hInfl').style.color = q.infl.pronta
    ? (q.infl.valore > 1.12 ? 'var(--allarme)' : q.infl.valore < 0.9 ? 'var(--verde)' : 'var(--testo)')
    : 'var(--tenue)';

  const v = $('#vista');
  v.innerHTML = '';
  if (scheda === 'asta') v.append(vistaAsta(q));
  else if (scheda === 'listone') v.append(vistaListone());
  else v.append(vistaPiano());

  document.querySelectorAll('nav button').forEach(b =>
    b.classList.toggle('on', b.dataset.t === scheda));
}

/* ------------------------------------------------------------ ASTA */
function vistaAsta(q) {
  const f = document.createDocumentFragment();
  const m = massimo(S.ruoloAttivo, 0);

  const banco = E('div', 'banco');

  const ruoli = E('div', 'ruoli');
  RUOLI.forEach(r => {
    const vuote = q.caselle[r].vuote;
    const b = E('button', (r === S.ruoloAttivo ? 'on ' : '') + (vuote ? '' : 'pieno'),
      `${r}<span class="mini">${vuote ? vuote + ' da fare' : 'completo'}</span>`);
    b.onclick = () => { S.ruoloAttivo = r; salva(); disegna(); };
    ruoli.append(b);
  });
  banco.append(ruoli);

  const cif = E('div', 'cifra' + (m.scoperto ? ' rosso' : ''));
  if (m.piena) {
    cif.innerHTML = `<div class="et">Reparto completo</div>
      <div class="n">✓</div>
      <div class="sotto">Non ti serve più niente qui. Passa a un altro ruolo.</div>`;
  } else {
    cif.innerHTML = `<div class="et">Massimo su questa casella</div>
      <div class="n">${m.valore}</div>
      <div class="sotto">casella di <b>fascia ${m.fascia}</b> · il piano ne prevedeva
        <b>${m.riferimento}</b></div>`;
  }
  banco.append(cif);

  // La barra di cassa: speso, impegnato dal piano, libero. È l'estratto conto.
  const libero = Math.max(0, q.cassa - q.impegnoTot);
  const tot = Math.max(1, S.budget);
  const barra = E('div', 'cassa');
  const seg = (w, col) => { const i = document.createElement('i');
    i.style.width = (w / tot * 100) + '%'; i.style.background = col; return i; };
  barra.append(seg(q.speso, 'var(--verde)'));
  barra.append(seg(Math.min(q.impegnoTot, q.cassa), 'var(--oro)'));
  barra.append(seg(libero, 'var(--rilievo)'));
  banco.append(barra);
  banco.append(E('div', 'legenda',
    `<span><i class="pallino" style="background:var(--verde)"></i>speso ${q.speso}</span>
     <span><i class="pallino" style="background:var(--oro)"></i>impegnato ${q.impegnoTot}</span>
     <span><i class="pallino" style="background:var(--rilievo)"></i>libero ${libero}</span>`));
  f.append(banco);

  if (q.scoperto) {
    f.append(E('div', 'avviso', `<b>Sei sotto il piano.</b> Per finire la rosa ai prezzi
      di stasera servirebbero ${q.impegnoTot} crediti e ne hai ${q.cassa}. Da qui in poi
      ogni casella scende di fascia: compra sotto il riferimento o rinuncia a un titolare.`));
  } else if (q.infl.pronta && q.infl.valore > 1.15) {
    f.append(E('div', 'avviso calmo', `L'asta sta pagando il <b>${Math.round((q.infl.valore-1)*100)}%
      sopra il listino</b>. I riferimenti qui sopra sono già stati rialzati: se compri al
      listino di agosto, stai comprando bene.`));
  } else if (q.infl.pronta && q.infl.valore < 0.9) {
    f.append(E('div', 'avviso calmo', `L'asta sta pagando <b>sotto il listino</b>. I riferimenti
      sono stati abbassati: tieni i crediti, più avanti costano meno.`));
  }

  // Le caselle: cosa ho, cosa manca, a che livello.
  f.append(E('div', 'sez', `<h2>La rosa</h2><span class="nota">verde = preso · grigio = fascia prevista</span>`));
  RUOLI.forEach(r => {
    const riga = E('div', 'riga');
    riga.append(E('div', 'rl', r));
    const c = E('div', 'caselle');
    S.miei.filter(a => a.r === r).forEach((a, i) => {
      const el = E('div', 'cs presa', a.prezzo);
      el.title = a.nome;
      el.onclick = () => apriAcquisto(a);
      c.append(el);
    });
    residue(r).forEach(fa => c.append(E('div', 'cs vuota', 'F' + fa)));
    riga.append(c);
    riga.append(E('div', 'tot', S.miei.filter(a => a.r === r)
      .reduce((t, a) => t + a.prezzo, 0)));
    f.append(riga);
  });

  const az = E('div', 'azioni');
  const b1 = E('button', 'btn primo', 'Ho comprato');
  b1.onclick = () => apriRicerca('mio');
  const b2 = E('button', 'btn spento', 'Venduto ad altri');
  b2.onclick = () => apriRicerca('altri');
  az.append(b1, b2);
  f.append(az);

  // Il piano B: chi resta, allo stesso prezzo, se questo me lo soffiano.
  if (!m.piena) {
    const alt = alternative(S.ruoloAttivo, m.fascia, 5);
    f.append(E('div', 'sez', `<h2>Se lo perdo</h2>
      <span class="nota">liberi, fascia ${m.fascia}</span>`));
    if (!alt.length) {
      f.append(E('div', 'vuoto', 'Non è rimasto nessuno in questa fascia. La casella scende di livello.'));
    } else {
      alt.forEach(g => f.append(rigaGiocatore(g)));
    }
  }
  return f;
}

function preso(id) { return S.venduti[id] != null || S.miei.some(a => a.id === id); }

function alternative(ruolo, fascia, quanti) {
  return DATI.giocatori
    .filter(g => g.r === ruolo && g.f === fascia && !preso(g.id))
    .sort((a, b) => (b.v ?? -9) - (a.v ?? -9))
    .slice(0, quanti);
}

/* ------------------------------------------------------------ LISTONE */
function vistaListone() {
  const f = document.createDocumentFragment();

  const box = E('div', 'filtri');
  const inp = E('input', 'cerca');
  inp.placeholder = 'Cerca un nome…';
  inp.value = filtro.testo;
  inp.oninput = e => { filtro.testo = e.target.value; aggiornaLista(); };
  box.append(inp);

  const c1 = E('div', 'chip');
  [['', 'Tutti'], ['P', 'P'], ['D', 'D'], ['C', 'C'], ['A', 'A']].forEach(([v, et]) => {
    const b = E('button', filtro.ruolo === v ? 'on' : '', et);
    b.onclick = () => { filtro.ruolo = v; disegna(); };
    c1.append(b);
  });
  const sep = E('button', filtro.soloLiberi ? 'on' : '', 'Solo liberi');
  sep.onclick = () => { filtro.soloLiberi = !filtro.soloLiberi; disegna(); };
  c1.append(sep);
  box.append(c1);

  const c2 = E('div', 'chip');
  [['p', 'Prezzo'], ['v', 'Meglio a pari prezzo'], ['c', 'Certezza'], ['y', 'Resa']]
    .forEach(([v, et]) => {
      const b = E('button', filtro.ordine === v ? 'on' : '', et);
      b.onclick = () => { filtro.ordine = v; disegna(); };
      c2.append(b);
    });
  box.append(c2);
  f.append(box);

  const cont = E('div', '');
  cont.id = 'lista';
  f.append(cont);
  setTimeout(aggiornaLista, 0);
  return f;
}

function aggiornaLista() {
  const cont = document.getElementById('lista');
  if (!cont) return;
  const t = filtro.testo.trim().toLowerCase();
  let ls = DATI.giocatori.filter(g => {
    if (filtro.ruolo && g.r !== filtro.ruolo) return false;
    if (filtro.soloLiberi && preso(g.id)) return false;
    if (t && !(g.n + ' ' + g.s).toLowerCase().includes(t)) return false;
    return true;
  });
  const chiave = {p:g => g.p, v:g => g.v ?? -9, c:g => g.c ?? -9, y:g => g.y ?? -9}[filtro.ordine];
  ls.sort((a, b) => chiave(b) - chiave(a));
  cont.innerHTML = '';
  if (!ls.length) { cont.append(E('div', 'vuoto', 'Nessun giocatore con questi filtri.')); return; }
  ls.slice(0, 80).forEach(g => cont.append(rigaGiocatore(g)));
  if (ls.length > 80) cont.append(E('div', 'vuoto', `Altri ${ls.length - 80}. Restringi la ricerca.`));
}

function rigaGiocatore(g) {
  const el = E('div', 'g' + (preso(g.id) ? ' via' : ''));
  const tag = [];
  if (g.f === 1) tag.push('<span class="tag f1">fascia 1</span>');
  else tag.push(`<span class="tag">F${g.f}</span>`);
  if (g.c == null) tag.push('<span class="tag ignoto">nessuno storico</span>');
  if (g.rig === 'rigorista') tag.push('<span class="tag rig">rigorista</span>');
  if (g.v != null && g.v >= 0.25 && g.c != null && g.c >= 75)
    tag.push(`<span class="tag buono">+${g.v.toFixed(2)} a pari prezzo</span>`);

  const barra = g.c == null ? '' :
    `<span class="barrina"><i style="width:${g.c}%;background:${g.c >= 80 ? 'var(--verde)' : g.c >= 55 ? 'var(--oro)' : 'var(--allarme)'}"></i></span>`;

  el.innerHTML = `
    <div class="id">
      <div class="nm">${g.n}</div>
      <div class="sq">${g.s} ${barra} ${tag.join(' ')}</div>
    </div>
    <div class="pz">${g.p}<small>listino</small></div>`;
  el.onclick = () => apriGiocatore(g);
  return el;
}

function vistaPiano() {
  const f = document.createDocumentFragment();

  f.append(E('div', 'sez', '<h2>La lega</h2>'));
  f.append(campoNumero('Budget', S.budget, v => { S.budget = v; rigeneraPiano(); }, 'crediti a squadra'));
  f.append(campoNumero('Squadre', S.squadre, v => { S.squadre = v; }, 'quante siete in asta'));
  RUOLI.forEach(r => f.append(campoNumero(NOME_RUOLO[r], S.slot[r], v => {
    S.slot[r] = v; rigeneraPiano();
  }, 'caselle in rosa')));

  f.append(E('div', 'sez', '<h2>Strategia</h2>'));

  sel.innerHTML = `<div><label>Come divido i crediti</label>

  Object.keys(PIANI).forEach(k => {
    const o = document.createElement('option');
    o.value = k; o.textContent = k; o.selected = (k === S.strategia);
    s.append(o);
  });
  s.onchange = e => { S.strategia = e.target.value; rigeneraPiano(); salva(); disegna(); };
  sel.append(s);
  f.append(sel);

  const reg = E('div', 'campo');
  reg.innerHTML = `<div><label>Se sforo, chi paga</label>
    <div class="aiuto">deciso a freddo una volta sola</div></div>`;
  const s2 = E('select');
  [['basso', 'la casella più bassa del reparto'],
   ['reparto', 'il reparto meno importante'],
   ['proporzionale', 'un po\' tutti']].forEach(([v, et]) => {
    const o = document.createElement('option');
    o.value = v; o.textContent = et; o.selected = (v === S.regola);
    s2.append(o);
  });
  s2.onchange = e => { S.regola = e.target.value; salva(); };
  reg.append(s2);
  f.append(reg);

  f.append(E('div', 'sez', `<h2>Le caselle</h2>
    <span class="nota">totale ${costoPiano(S.piano)} / ${S.budget}</span>`));
  RUOLI.forEach(r => f.append(fasciera(r)));

  const az = E('div', 'azioni');
  const b1 = E('button', 'btn', 'Copia lo stato');
  b1.onclick = esporta;
  const b2 = E('button', 'btn spento', 'Ricomincia');
  b2.onclick = azzera;
  az.append(b1, b2);
  f.append(az);

  f.append(E('div', 'piede', `Ogni numero di questa app si ricalcola dal listone e dai prezzi
    che inserisci tu. Nessuna connessione, nessuna previsione di rendimento: le fasce sono
    la fila d'attesa dei ${S.squadre} partecipanti, la certezza sono presenze e minuti già
    giocati, la resa è la fantamedia corretta per quante partite l'ha tenuta.
    Listone aggiornato al ${DATI.aggiornato}.`));
  return f;
}

function campoNumero(et, val, fn, aiuto) {
  const c = E('div', 'campo');
  c.innerHTML = `<div><label>${et}</label>${aiuto ? `<div class="aiuto">${aiuto}</div>` : ''}</div>`;
  const i = document.createElement('input');
  i.type = 'number'; i.value = val; i.min = 1;
  i.onchange = e => { const v = parseInt(e.target.value, 10);
    if (v > 0) { fn(v); salva(); disegna(); } };
  c.append(i);
  return c;
}

function fasciera(r) {
  const c = E('div', 'fasciera');
  const conteggio = {};
  (S.piano[r] || []).forEach(f => conteggio[f] = (conteggio[f] || 0) + 1);
  const presi = S.miei.filter(a => a.r === r).length;
  const costo = (S.piano[r] || []).reduce((t, f) => t + rif(r, f), 0);
  c.append(E('div', 'cap', `<b>${NOME_RUOLO[r]}</b>
    <span>${presi} presi · ${(S.piano[r] || []).length} da fare · ${costo} cr</span>`));
  for (let f = 1; f <= 5; f++) {
    const l = E('div', 'livello');
    l.innerHTML = `<span class="nome">Fascia ${f} <i>~${rif(r, f)} cr</i></span>`;
    const meno = E('button', '', '−');
    const cnt = E('div', 'cnt', String(conteggio[f] || 0));
    const piu = E('button', '', '+');
    meno.onclick = () => { declassa(r, f); };
    piu.onclick = () => { promuovi(r, f); };
    l.append(meno, cnt, piu);
    c.append(l);
  }
  return c;
}

/* Muovere una casella significa spostarla di livello, non aggiungerla: quante
   caselle hai lo decide la rosa, non tu. Il + prende la casella buona più
   vicina sotto e la porta qui; il − manda una di queste un gradino più giù. */
function declassa(r, fascia) {
  const lista = S.piano[r] || [];
  const i = lista.indexOf(fascia);
  if (i < 0 || fascia >= 5) return;
  lista[i] = fascia + 1;
  lista.sort((a, b) => a - b);
  salva(); disegna();
}

function promuovi(r, fascia) {
  const lista = S.piano[r] || [];
  let scelto = -1;
  for (let f = fascia + 1; f <= 5; f++) {
    const i = lista.indexOf(f);
    if (i >= 0) { scelto = i; break; }
  }
  if (scelto < 0) return;
  lista[scelto] = fascia;
  lista.sort((a, b) => a - b);
  salva(); disegna();
}

/* ============================================================ FOGLI */
function chiudi() { $('#modale').innerHTML = ''; }

function foglio(dentro) {
  const velo = E('div', 'velo');
  const f = E('div', 'foglio');
  f.append(E('div', 'maniglia'));
  f.append(dentro);
  velo.append(f);
  velo.onclick = e => { if (e.target === velo) chiudi(); };
  $('#modale').innerHTML = '';
  $('#modale').append(velo);
}

function apriRicerca(modo) {
  const d = document.createDocumentFragment();
  d.append(E('h3', '', modo === 'mio' ? 'Chi hai preso' : 'Chi è stato venduto'));
  d.append(E('div', 'oc', modo === 'mio'
    ? 'Cerca il nome, poi metti quanto l\'hai pagato.'
    : 'Serve solo il prezzo: misura quanto sta pagando la stanza. Di chi sia la squadra non interessa.'));
  const inp = E('input', 'cerca');
  inp.placeholder = 'Cerca…';
  d.append(inp);
  const box = E('div', '');
  box.style.marginTop = '10px';
  d.append(box);
  const cerca = () => {
    const t = inp.value.trim().toLowerCase();
    box.innerHTML = '';
    if (t.length < 2) { box.append(E('div', 'vuoto', 'Scrivi almeno due lettere.')); return; }
    const ls = DATI.giocatori.filter(g => !preso(g.id) &&
      (g.n + ' ' + g.s).toLowerCase().includes(t)).slice(0, 12);
    if (!ls.length) { box.append(E('div', 'vuoto', 'Nessuno con questo nome ancora libero.')); return; }
    ls.forEach(g => {
      const el = rigaGiocatore(g);
      el.onclick = () => apriGiocatore(g, modo);
      box.append(el);
    });
  };
  inp.oninput = cerca;
  foglio(d);
  setTimeout(() => inp.focus(), 60);
}

function apriGiocatore(g, modo) {
  const d = document.createDocumentFragment();
  d.append(E('h3', '', g.n));
  d.append(E('div', 'oc', `${NOME_RUOLO[g.r]} · ${g.s} · listino ${g.p} crediti · fascia ${g.f}`));

  const fatti = E('div', 'fatti');
  const f = (et, vl, col) => `<div class="fatto"><div class="et">${et}</div>
    <div class="vl" ${col ? `style="color:${col}"` : ''}>${vl}</div></div>`;
  fatti.innerHTML =
    f('Certezza', g.c == null ? '—' : g.c,
      g.c == null ? 'var(--allarme)' : g.c >= 80 ? 'var(--verde)' : g.c >= 55 ? 'var(--oro)' : 'var(--allarme)') +
    f('Presenze', g.pv || '—') +
    f('Fantamedia', g.fm ?? '—') +
    f('Resa', g.y ?? '—') +
    f('Gol', g.g) +
    f('Assist', g.a);
  d.append(fatti);

  // Solo fatti, in prosa. Niente pronostici: quello che non si sa si dice.
  const righe = [];
  righe.push(g.c == null
    ? `<b>Non ci sono dati utili su di lui.</b> Neopromosso, arrivato da fuori o mai
       impiegato: qualunque cifra sulla sua stagione sarebbe inventata. Trattalo come una
       scommessa e mettici il minimo.`
    : `<b>${g.nc}.</b> ${g.pv} presenze in campionato.`);
  if (g.rig) righe.push(`Nel dubbio conta che <b>${g.rig}</b>: sui rigori i bonus arrivano
    anche nelle domeniche storte.`);
  if (g.v != null) {
    const seg = g.v >= 0.25 ? 'var(--verde)' : g.v <= -0.25 ? 'var(--allarme)' : 'var(--fioco)';
    righe.push(`Rispetto a chi costa più o meno come lui nel suo ruolo, rende
      <b style="color:${seg}">${g.v >= 0 ? '+' : ''}${g.v.toFixed(2)}</b> di fantamedia${
      g.vc != null ? ` e gioca <b style="color:${seg}">${g.vc >= 0 ? '+' : ''}${g.vc}</b>
      di certezza` : ''}.`);
  }
  d.append(E('div', 'prosa', righe.join(' ')));

  // Quanto posso permettermelo davvero, adesso.
  const m = massimo(g.r, 0);
  if (!m.piena) {
    const ok = m.valore >= g.p;
    d.append(E('div', 'avviso' + (ok ? ' calmo' : ''),
      ok ? `Puoi arrivare a <b>${m.valore}</b>. Il listino dice ${g.p}: sei coperto.`
         : `Puoi arrivare a <b>${m.valore}</b>, il listino dice ${g.p}. Se lo prendi
            comunque, qualche casella scende di fascia.`));
  }

  let prezzo = Math.max(1, g.p);
  const sp = E('div', 'spesa');
  const meno = E('button', '', '−');
  const inp = document.createElement('input');
  inp.type = 'number'; inp.value = prezzo; inp.min = 1; inp.inputMode = 'numeric';
  const piu = E('button', '', '+');
  meno.onclick = () => { inp.value = Math.max(1, (+inp.value || 1) - 1); };
  piu.onclick = () => { inp.value = (+inp.value || 0) + 1; };
  sp.append(meno, inp, piu);
  d.append(sp);

  const az = E('div', 'azioni');
  if (modo !== 'altri') {
    const b1 = E('button', 'btn primo', 'L\'ho preso io');
    b1.onclick = () => {
      const p = Math.max(1, parseInt(inp.value, 10) || 1);
      const esito = compra(g, p);
      chiudi();
      if (esito.errore) { avvisa(esito.errore); }
      else { S.ruoloAttivo = g.r; scheda = 'asta'; disegna(); mostraEsito(g, p, esito); }
    };
    az.append(b1);
  }
  const b2 = E('button', 'btn spento', 'Preso da un altro');
  b2.onclick = () => {
    S.venduti[g.id] = Math.max(1, parseInt(inp.value, 10) || 1);
    salva(); chiudi(); disegna();
  };
  az.append(b2);
  d.append(az);
  foglio(d);
}

function apriAcquisto(a) {
  const d = document.createDocumentFragment();
  d.append(E('h3', '', a.nome));
  d.append(E('div', 'oc', `${NOME_RUOLO[a.r]} · pagato ${a.prezzo} · casella di fascia ${a.fascia}`));
  const az = E('div', 'azioni');
  const b = E('button', 'btn spento', 'Annulla questo acquisto');
  b.onclick = () => {
    const i = S.miei.findIndex(x => x.id === a.id);
    if (i >= 0) annulla(i);
    chiudi(); disegna();
  };
  az.append(b);
  d.append(az);
  foglio(d);
}

function mostraEsito(g, prezzo, esito) {
  const d = document.createDocumentFragment();
  d.append(E('h3', '', `${g.n}, ${prezzo} crediti`));
  d.append(E('div', 'oc', `Casella di fascia ${esito.fascia} — il piano ne prevedeva ${esito.riferimento}.`));

  const m = massimo(S.ruoloAttivo, 0);
  const q = m.q;
  if (esito.avanzo > 0) {
    const conto = {};
    esito.eco.mosse.forEach(x => conto[x.ruolo] = (conto[x.ruolo] || 0) + 1);
    const chi = Object.entries(conto).map(([r, n]) =>
      `${n} casella${n > 1 ? 'e' : ''} in ${NOME_RUOLO[r].toLowerCase()}`).join(', ');
    d.append(E('div', 'prosa', esito.eco.mosse.length
      ? `Hai speso <b>${esito.avanzo} sopra il piano</b>. Li ho recuperati abbassando di
         fascia ${chi}.${esito.eco.residuo ? ` Restano <b>${esito.eco.residuo}</b> scoperti:
         non c'è più niente da abbassare.` : ''}`
      : `Hai speso <b>${esito.avanzo} sopra il piano</b> e non c'è più niente da abbassare.
         Le prossime caselle vanno prese al minimo.`));
  } else if (esito.avanzo < 0) {
    d.append(E('div', 'prosa', `Hai risparmiato <b>${-esito.avanzo} crediti</b> sul piano.
      Sono tornati in cassa e allargano le caselle che restano.`));
  } else {
    d.append(E('div', 'prosa', 'Esattamente al piano.'));
  }

  const fatti = E('div', 'fatti');
  fatti.innerHTML =
    `<div class="fatto"><div class="et">Cassa</div><div class="vl">${q.cassa}</div></div>
     <div class="fatto"><div class="et">Caselle</div><div class="vl">${q.vuoteTot}</div></div>
     <div class="fatto"><div class="et">Prossimo max</div>
       <div class="vl" style="color:var(--oro)">${m.piena ? '—' : m.valore}</div></div>`;
  d.append(fatti);

  const az = E('div', 'azioni');
  const b = E('button', 'btn primo', 'Avanti');
  b.onclick = chiudi;
  az.append(b);
  d.append(az);
  foglio(d);
}

function avvisa(testo) {
  const d = document.createDocumentFragment();
  d.append(E('div', 'prosa', testo));
  const az = E('div', 'azioni');
  const b = E('button', 'btn', 'Ok');
  b.onclick = chiudi;
  az.append(b); d.append(az);
  foglio(d);
}

async function esporta() {
  const testo = JSON.stringify(S);
  let fatto = false;
  try { await navigator.clipboard.writeText(testo); fatto = true; } catch (e) { fatto = false; }
  const d = document.createDocumentFragment();
  d.append(E('h3', '', fatto ? 'Copiato' : 'Copia a mano'));
  d.append(E('div', 'prosa', fatto
    ? 'Lo stato dell\'asta è negli appunti. Incollalo dove vuoi: se il telefono si blocca, lo rimetti da lì.'
    : 'Seleziona e copia questo testo. È tutta l\'asta.'));
  if (!fatto) {
    const t = document.createElement('textarea');
    t.value = testo;
    t.style.cssText = 'width:100%;height:120px;background:var(--rilievo);color:var(--fioco);border:1px solid var(--linea);border-radius:10px;padding:10px;font-family:var(--mono);font-size:11px';
    d.append(t);
  }
  const az = E('div', 'azioni');
  const b = E('button', 'btn', 'Chiudi'); b.onclick = chiudi;
  az.append(b); d.append(az);
  foglio(d);
}

function azzera() {
  const d = document.createDocumentFragment();
  d.append(E('h3', '', 'Ricominciare da zero'));
  d.append(E('div', 'prosa', 'Cancella gli acquisti, i prezzi degli altri e riporta il piano ai valori di partenza. Non si torna indietro.'));
  const az = E('div', 'azioni');
  const b1 = E('button', 'btn spento', 'Lascia stare'); b1.onclick = chiudi;
  const b2 = E('button', 'btn primo', 'Cancella tutto');
  b2.onclick = () => {
    S.miei = []; S.venduti = {}; rigeneraPiano(); salva(); chiudi(); scheda = 'asta'; disegna();
  };
  az.append(b1, b2); d.append(az);
  foglio(d);
}

/* ============================================================ AVVIO */
document.querySelectorAll('nav button').forEach(b =>
  b.onclick = () => { scheda = b.dataset.t; window.scrollTo(0, 0); disegna(); });

ripristina().then(disegna);
</script>
</body>
</html>
