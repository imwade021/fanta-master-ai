<title>+3 — il banco della tua asta</title>
<style>
:root{
  --fondo:#10141c; --carta:#1a2029; --rilievo:#222a35; --linea:#2c3542;
  --testo:#e9ecf1; --fioco:#8b94a3; --tenue:#5d6674;
  --oro:#f0b429; --allarme:#e06c5b; --verde:#6fbf9b; --acqua:#63a8c9;
  --raggio:14px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* Il browser aspetta dopo ogni tocco per vedere se ne arriva un secondo: se
   arriva, zooma. Premendo "+" in fretta per alzare un'offerta si otteneva
   quindi una pagina ingrandita e nessun credito in piu'.

   Va dichiarato sulla radice, non sui bottoni: per decidere se zoomare il
   browser guarda anche gli antenati dell'elemento toccato. Il pizzico a due
   dita continua a funzionare - quello serve davvero. */
html{touch-action:manipulation}
button,input,select,.g,.cs,.tab,nav button{touch-action:manipulation}
button,.g,.cs,.rl,.tot,.legenda{user-select:none;-webkit-user-select:none}

html,body{margin:0;padding:0}
body{
  background:var(--fondo); color:var(--testo); font-family:var(--sans);
  font-size:15px; line-height:1.45; padding-bottom:calc(74px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.marchio{display:flex;align-items:center;gap:8px;padding:7px 14px 0;max-width:560px;
  margin:0 auto}
.marchio img{border-radius:6px;display:block}
.marchio span{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--fioco)}
.annulla{margin-left:auto;font-size:12px;font-weight:600;color:var(--acqua);
  padding:6px 10px;border-radius:8px;border:1px solid var(--linea);min-height:32px}
.annulla:active{background:var(--rilievo)}
.annulla[hidden]{display:none}

/* ---------- testata ---------- */
header{
  position:sticky;top:0;z-index:40;background:rgba(16,20,28,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--linea);
  padding-top:env(safe-area-inset-top);
}
.barra{display:flex;align-items:stretch;gap:1px;background:var(--linea);
  border-bottom:1px solid var(--linea)}
.cella{flex:1;background:var(--fondo);padding:9px 10px;text-align:center}
.cella .et{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tenue)}
.cella .vl{font-family:var(--mono);font-size:17px;font-weight:600;
  font-variant-numeric:tabular-nums;margin-top:1px}

/* ---------- schede ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(16,20,28,.97);backdrop-filter:blur(12px);
  border-top:1px solid var(--linea);display:flex;
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{flex:1;padding:13px 4px 14px;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--tenue);border-top:2px solid transparent}
nav button.on{color:var(--oro);border-top-color:var(--oro)}

/* ---------- il numero ---------- */
.banco{background:var(--carta);border:1px solid var(--linea);border-radius:var(--raggio);
  margin:14px 0;overflow:hidden}
.ruoli{display:flex;gap:1px;background:var(--linea)}
.ruoli button{flex:1;background:var(--carta);padding:11px 0;font-size:12px;font-weight:600;
  letter-spacing:.1em;color:var(--tenue)}
.ruoli button.on{background:var(--rilievo);color:var(--testo)}
.ruoli button .mini{display:block;font-size:9.5px;font-weight:400;color:var(--tenue);
  letter-spacing:.04em;margin-top:2px}
.ruoli button.on .mini{color:var(--fioco)}
.ruoli button.pieno{color:var(--verde)}

.cifra{padding:22px 18px 16px;text-align:center}
.cifra .et{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--fioco)}
.cifra .n{font-family:var(--mono);font-size:66px;font-weight:700;line-height:.94;
  color:var(--oro);font-variant-numeric:tabular-nums;letter-spacing:-.04em;margin:6px 0 2px;
  transition:color .18s}
.cifra.rosso .n{color:var(--allarme)}
.cifra .um{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--tenue);
  margin-top:-2px}
.conto{padding:0 18px 4px;font-size:13px;color:var(--fioco);line-height:1.55;text-align:center}
.conto b{color:var(--testo);font-weight:600}
.conto .perche{display:block;margin-top:9px;padding-top:9px;border-top:1px solid var(--linea);
  font-size:12.5px;color:var(--tenue)}
.conto .perche b{color:var(--fioco)}
.scarso{margin:10px 14px 0;padding:9px 12px;border-radius:10px;font-size:12.5px;
  line-height:1.5;text-align:center;color:var(--fioco);background:var(--rilievo);
  border:1px solid var(--linea)}
.scarso b{color:var(--testo)}
.scarso.stretta{border-color:rgba(224,108,91,.4);background:rgba(224,108,91,.1);
  color:#f2b3a8}
.scarso.stretta b{color:var(--allarme)}

/* barra di cassa */
.cassa{display:flex;height:7px;margin:2px 14px 0;border-radius:4px;overflow:hidden;
  background:var(--rilievo)}
.cassa i{display:block;height:100%}
.legenda{display:flex;justify-content:space-between;padding:7px 14px 14px;
  font-size:10.5px;color:var(--tenue)}
.legenda span{display:flex;align-items:center;gap:5px}
.pallino{width:7px;height:7px;border-radius:2px;display:inline-block}

/* ---------- griglia caselle ---------- */
.sez{margin:18px 0 8px;display:flex;align-items:baseline;justify-content:space-between}
.sez h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--fioco);
  margin:0;font-weight:600}
.sez .nota{font-size:11px;color:var(--tenue)}

.riga{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--carta);
  border:1px solid var(--linea);border-radius:10px;margin-bottom:7px}
.riga .rl{width:26px;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--fioco);
  flex:none;text-align:center}
.caselle{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.cs{min-width:30px;height:26px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;
  padding:0 5px}
.cs.presa{background:rgba(111,191,155,.16);color:var(--verde);
  border:1px solid rgba(111,191,155,.3);font-weight:600}
.cs.vuota{background:var(--rilievo);color:var(--tenue);border:1px solid var(--linea)}
.riga .tot{font-family:var(--mono);font-size:12px;color:var(--fioco);flex:none;
  font-variant-numeric:tabular-nums}

/* ---------- pulsanti ---------- */
.azioni{display:flex;gap:8px;margin:14px 0}
.btn{flex:1;padding:14px 10px;border-radius:11px;font-size:13.5px;font-weight:600;
  text-align:center;border:1px solid var(--linea);background:var(--carta)}
.btn.primo{background:var(--oro);color:#171307;border-color:var(--oro)}
.btn.spento{color:var(--fioco)}
.btn:active{transform:scale(.98)}

.avviso{border-radius:11px;padding:11px 13px;font-size:13px;margin:12px 0;
  border:1px solid rgba(224,108,91,.4);background:rgba(224,108,91,.1);color:#f2b3a8}
.avviso b{color:var(--allarme)}
.avviso.calmo{border-color:rgba(99,168,201,.35);background:rgba(99,168,201,.09);color:#bcd9e6}

/* ---------- listone ---------- */
.filtri{position:sticky;top:0;z-index:20;background:var(--fondo);padding:10px 0 8px}
.cerca{width:100%;padding:11px 13px;border-radius:10px;background:var(--carta);
  border:1px solid var(--linea);font-size:16px}
.cerca::placeholder{color:var(--tenue)}
.chip{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none}
.chip::-webkit-scrollbar{display:none}
/* Sotto i 44px di area toccabile si sbaglia, e all'asta sbagliare un filtro
   significa cercare in una lista che non contiene chi stai cercando. */
.chip button{padding:11px 14px;border-radius:20px;font-size:13px;white-space:nowrap;
  min-height:44px;
  border:1px solid var(--linea);background:var(--carta);color:var(--fioco)}
.chip button.on{background:var(--rilievo);color:var(--testo);border-color:var(--tenue)}

.g{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid var(--linea)}
/* La figurina va mostrata intera: qualunque ritaglio le toglie qualcosa, e
   quello che toglie e' sempre la parte che distingue un giocatore dall'altro.
   Quindi nessun ritaglio - l'immagine sta dentro il riquadro per intero e il
   riquadro prende la forma dell'immagine, non il contrario.

   L'altezza e' fissa, la larghezza la decide la figurina stessa. Finche' non
   e' arrivata si tiene in caldo lo spazio con la proporzione imparata dalla
   prima che si carica: senza, ogni riga si allargherebbe di scatto a meta'
   scorrimento. */
.faccia{
  --alta:46px;
  position:relative;flex:none;height:var(--alta);
  width:calc(var(--alta) * var(--forma-figurina, .78));
  border-radius:9px;overflow:hidden;background:var(--rilievo);
  display:flex;align-items:center;justify-content:center}
.faccia span{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:12.5px;font-weight:700;color:var(--tenue);
  letter-spacing:.02em}
.faccia img{position:relative;display:block;height:100%;width:auto;max-width:none;
  opacity:0;transition:opacity .25s}
.faccia img.c{opacity:1}
/* Un bordo interno stacca la figurina dal fondo della riga. */
.faccia::after{content:'';position:absolute;inset:0;border-radius:inherit;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);pointer-events:none}
.faccia.grande{--alta:96px;border-radius:14px}
.faccia.grande span{font-size:20px}
.testata{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.testata h3{margin-bottom:2px}
.g.via{opacity:.34}
.g .id{flex:1;min-width:0}
.g .nm{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.g .sq{font-size:11px;color:var(--tenue);margin-top:1px;display:flex;gap:6px;
  align-items:center;flex-wrap:wrap}
.g .pz{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--oro);
  font-variant-numeric:tabular-nums;flex:none;text-align:right;min-width:38px}
.g .pz small{display:block;font-size:9.5px;color:var(--tenue);font-weight:400}
.tag{font-size:9.5px;padding:1.5px 5px;border-radius:4px;letter-spacing:.04em;
  border:1px solid var(--linea);color:var(--fioco);white-space:nowrap}
.tag.f1{border-color:rgba(240,180,41,.5);color:var(--oro)}
.tag.rig{border-color:rgba(99,168,201,.5);color:var(--acqua)}
.tag.buono{border-color:rgba(111,191,155,.5);color:var(--verde)}
.tag.ignoto{border-color:rgba(224,108,91,.45);color:var(--allarme)}
.tag.fuori{border-color:var(--allarme);background:rgba(224,108,91,.16);color:#f2b3a8;
  font-weight:600}
.g.assente .nm{color:#f2b3a8}
.fuoriora{border-radius:11px;padding:11px 13px;font-size:13px;margin:10px 0;
  border:1px solid rgba(224,108,91,.45);background:rgba(224,108,91,.12);color:#f2b3a8}
.fuoriora b{color:var(--allarme)}
.barrina{width:34px;height:4px;border-radius:2px;background:var(--rilievo);
  overflow:hidden;flex:none}
.barrina i{display:block;height:100%;background:var(--verde)}

/* ---------- foglio ---------- */
.velo{position:fixed;inset:0;z-index:60;background:rgba(8,10,14,.72);
  display:flex;align-items:flex-end;justify-content:center;
  animation:sfuma .16s ease}
@keyframes sfuma{from{opacity:0}to{opacity:1}}
.foglio{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  background:var(--carta);border-radius:18px 18px 0 0;border-top:1px solid var(--linea);
  padding:8px 16px calc(22px + env(safe-area-inset-bottom));
  animation:sali .22s cubic-bezier(.2,.8,.3,1)}
@keyframes sali{from{transform:translateY(28px)}to{transform:translateY(0)}}
.maniglia{width:38px;height:4px;border-radius:2px;background:var(--linea);margin:6px auto 14px}
.foglio h3{margin:0 0 2px;font-size:21px}
.foglio .oc{font-size:12.5px;color:var(--fioco);margin-bottom:14px}

.fatti{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--linea);
  border:1px solid var(--linea);border-radius:10px;overflow:hidden;margin-bottom:12px}
.fatto{background:var(--carta);padding:9px 8px;text-align:center}
.fatto .et{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
.fatto .vl{font-family:var(--mono);font-size:16px;font-weight:600;margin-top:2px;
  font-variant-numeric:tabular-nums}
.motivi{margin:10px 0 4px}
.mot{font-size:12.8px;color:var(--fioco);line-height:1.5;padding:6px 0 6px 15px;
  position:relative;border-bottom:1px solid var(--linea)}
.mot:last-child{border-bottom:none}
.mot::before{content:'';position:absolute;left:2px;top:13px;width:5px;height:5px;
  border-radius:50%;background:var(--tenue)}
.prosa{font-size:13px;color:var(--fioco);line-height:1.55;margin:10px 0}
.prosa b{color:var(--testo);font-weight:600}

.spesa{display:flex;align-items:center;gap:9px;margin:14px 0 6px}
.spesa input{flex:1;padding:13px;border-radius:10px;background:var(--rilievo);
  border:1px solid var(--linea);font-family:var(--mono);font-size:19px;text-align:center;
  font-variant-numeric:tabular-nums}
.spesa button{width:52px;height:52px;border-radius:10px;background:var(--rilievo);
  border:1px solid var(--linea);font-size:22px;color:var(--fioco);flex:none}
.spesa input.caro{border-color:var(--allarme);color:#f2b3a8}
.spia{font-size:12.5px;line-height:1.5;color:#f2b3a8;padding:0 2px;min-height:0}
.spia.viva{padding:8px 11px;border-radius:9px;margin-bottom:4px;
  background:rgba(224,108,91,.12);border:1px solid rgba(224,108,91,.35)}
.incolla{width:100%;height:110px;background:var(--rilievo);color:var(--fioco);
  border:1px solid var(--linea);border-radius:10px;padding:10px;resize:vertical;
  font-family:var(--mono);font-size:16px;margin:10px 0 6px}
.scorci{display:flex;gap:6px;margin-bottom:4px}
.scorci button{flex:1;padding:9px 4px;border-radius:9px;font-size:12px;font-weight:600;
  background:var(--rilievo);border:1px solid var(--linea);color:var(--fioco);min-height:40px}
.scorci button:active{background:var(--carta)}

/* ---------- piano ---------- */
.campo{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;
  background:var(--carta);border:1px solid var(--linea);border-radius:10px;margin-bottom:7px}
.campo label{font-size:13.5px}
.campo .aiuto{font-size:11px;color:var(--tenue);margin-top:2px}
.campo input,.campo select{width:86px;padding:9px 8px;border-radius:8px;background:var(--rilievo);
  /* Sotto i 16px iOS ingrandisce la pagina appena tocchi il campo, e non la
     rimpicciolisce piu' da solo. Sedici e' la soglia, non una preferenza. */
  font-size:16px;
  border:1px solid var(--linea);font-family:var(--mono);text-align:center}
.campo select{width:auto;font-family:var(--sans);font-size:16px;text-align:left}

.fasciera{background:var(--carta);border:1px solid var(--linea);border-radius:10px;
  padding:11px 12px;margin-bottom:7px}
.fasciera .cap{display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:9px}
.fasciera .cap b{font-size:14px}
.fasciera .cap span{font-family:var(--mono);font-size:12.5px;color:var(--fioco)}
.livello{display:flex;align-items:center;gap:9px;padding:5px 0}
.livello .nome{flex:1;font-size:12.5px;color:var(--fioco)}
.livello .nome i{font-style:normal;color:var(--tenue);font-size:11px}
.livello .cnt{font-family:var(--mono);font-size:15px;width:22px;text-align:center;
  font-variant-numeric:tabular-nums}
.livello button{width:30px;height:30px;border-radius:8px;background:var(--rilievo);
  border:1px solid var(--linea);color:var(--fioco);font-size:16px;line-height:1}

.piede{font-size:11.5px;color:var(--tenue);line-height:1.6;margin:20px 0 8px;
  padding-top:14px;border-top:1px solid var(--linea)}
.vuoto{text-align:center;color:var(--tenue);font-size:13px;padding:34px 20px;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- carta ----------
   Se il telefono muore a meta' asta, avere su carta le fasce e i prezzi di
   riferimento e' meglio di ricominciare a mente. Si stampa quello che serve
   davvero: piano, rosa, e i primi liberi di ogni fascia. */
@media print {
  header, nav, #modale, .filtri, .azioni, .ancora, .faccia { display: none !important; }
  body { background: #fff; color: #000; padding: 0; font-size: 10.5pt; }
  .wrap { max-width: none; padding: 0; }
  .sez h2 { color: #000; font-size: 12pt; border-bottom: 1px solid #000;
            padding-bottom: 2px; margin-top: 10pt; }
  .sez .nota, .aiuto, .conto .perche { color: #444; }
  .g { border-bottom: 1px solid #ccc; padding: 3pt 0; break-inside: avoid; }
  .g .nm, .g .sq, .g .pz { color: #000; }
  .tag { border-color: #999; color: #333; }
  .cifra .n { color: #000; }
  .carta-solo { display: block !important; }
  .schermo-solo { display: none !important; }
  a[href]:after { content: ''; }
}
.carta-solo { display: none; }
</style>
</head>

const NOME_RUOLO = {P:'Portieri', D:'Difensori', C:'Centrocampisti', A:'Attaccanti'};
// Quanti se ne schierano davvero ogni domenica. Serve a impedire al piano di
// proporre tre portieri da titolare: il secondo e il terzo non giocano mai, e
// i crediti spesi li' sono crediti buttati.
const IN_CAMPO = {P:1, D:3, C:4, A:3};
const CHIAVE = 'banco:stato:v1';

/* ============================================================ MEMORIA
   L'asta dura due ore e il telefono si blocca. Lo stato si salva a ogni
   tocco, su qualunque deposito il browser conceda; se non ne concede
   nessuno resta in memoria e il pulsante di esportazione diventa
   l'unica rete. Non si perde niente in silenzio. */
const Deposito = (() => {
  let cache = null;
  const prova = async (fn, fallback) => { try { return await fn(); } catch (e) { return fallback; } };
  return {
    async leggi() {
      if (typeof window.storage !== 'undefined') {
        const r = await prova(() => window.storage.get(CHIAVE), null);
        if (r && r.value) return JSON.parse(r.value);
      }
      const l = await prova(() => localStorage.getItem(CHIAVE), null);
      if (l) return JSON.parse(l);
      return cache;
    },
    async scrivi(o) {
      cache = o;
      const testo = JSON.stringify(o);
      if (typeof window.storage !== 'undefined') {
        await prova(() => window.storage.set(CHIAVE, testo), null);
      }
      await prova(() => localStorage.setItem(CHIAVE, testo), null);
    }
  };
})();

/* ============================================================ STATO */
const PIANI = {
  corazzata:  {quota:{P:.05, D:.15, C:.30, A:.50}, cima:+1,
               desc:'due o tre nomi grossi, il resto a un credito'},
  equilibrata:{quota:{P:.07, D:.20, C:.32, A:.41}, cima:0,
               desc:'un titolare per reparto, poi si scala'},
  spalmata:   {quota:{P:.09, D:.26, C:.34, A:.31}, cima:-1,
               desc:'nessun buco, nessun campione'}
};

let S = {
  budget: DATI.budget, squadre: DATI.squadre,
  slot: Object.assign({}, DATI.slot),
  piano: null,             // {ruolo:[fascia per casella ancora libera]}
  strategia: 'equilibrata',
  regola: 'basso',
  priorita: ['P','D','C','A'],   // chi paga per primo, dal meno prezioso
  modificatore: false,     // la lega usa il modificatore di difesa?
  miei: [], venduti: {},
  ruoloAttivo: 'A'
};
let scheda = 'asta', filtro = {testo:'', ruolo:'', soloLiberi:true, sani:false, ordine:'p'};

const INDICE = {};
DATI.giocatori.forEach(g => INDICE[g.id] = g);

/* Chi cerca "Kone" mentre il banditore grida non deve restare a bocca
   asciutta perche' nel listone c'e' scritto "Konè". Accenti via, da tutte e
   due le parti. */
const piatto = t => (t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
DATI.giocatori.forEach(g => g._c = piatto(g.n + ' ' + g.s));

/* ============================================================ MOTORE
   Tutta l'aritmetica sta qui e non guarda niente fuori: nessuna rete,
   nessuna stima. Stessi acquisti, stesso risultato, sempre. */

function rif(ruolo, fascia) {
  const r = (DATI.rotture[ruolo] || []).find(x => x.fascia === fascia);
  return r ? Math.max(1, r.rif) : 1;
}

/* Quanto sta pagando la stanza rispetto al listino. Si misura sui prezzi
   gridati ad alta voce - i miei e quelli degli altri - senza sapere né
   volere sapere di chi sia la squadra che li ha presi. */
function inflazione() {
  let pagato = 0, atteso = 0, n = 0;
  const conta = (id, prezzo) => {
    const g = INDICE[id];
    if (!g || g.p < 3) return;          // sotto i tre crediti il rapporto impazzisce
    pagato += prezzo; atteso += g.p; n++;
  };
  S.miei.forEach(a => conta(a.id, a.prezzo));
  Object.entries(S.venduti).forEach(([id, p]) => conta(+id, p));
  if (n < 8 || atteso <= 0) return {valore:1, campione:n, pronta:false};
  return {valore: pagato / atteso, campione:n, pronta:true};
}

function rifVivo(ruolo, fascia, infl) {
  return Math.max(1, Math.round(rif(ruolo, fascia) * infl));
}

/* Le caselle ancora da riempire, con la fascia che il piano le assegna. */
function residue(ruolo) { return (S.piano && S.piano[ruolo]) ? S.piano[ruolo].slice() : []; }

function impegno(ruolo, infl, salta) {
  const lista = residue(ruolo);
  let somma = 0;
  lista.forEach((f, i) => { if (i !== salta) somma += rifVivo(ruolo, f, infl); });
  return somma;
}

/* La domanda che conta all'asta non e' quanti crediti hanno gli altri - con
   dodici squadre non lo ricostruisci mai - ma QUANTE CASELLE DI QUESTO RUOLO
   restano da riempire in tutta la stanza. Se i portieri titolari finiti sono
   dieci su dodici, i due rimasti se li contendono in dieci: aspettare costa.
   Se ne restano quaranta, puoi aspettare quanto vuoi.

   Si ricava dai soli prezzi segnati, senza sapere di chi siano le squadre. */
function scarsita(ruolo) {
  const totale = S.squadre * S.slot[ruolo];
  let presi = S.miei.filter(a => a.r === ruolo).length;
  for (const id in S.venduti) {
    const g = INDICE[id];
    if (g && g.r === ruolo) presi++;
  }
  const restano = Math.max(0, totale - presi);
  const mie = residue(ruolo).length;
  return {totale, presi, restano, mie, altrui: Math.max(0, restano - mie),
          quota: totale ? presi / totale : 0};
}

function quadro() {
  const infl = inflazione();
  const speso = S.miei.reduce((t, a) => t + a.prezzo, 0);
  const cassa = S.budget - speso;
  const caselle = {}; let vuoteTot = 0, impegnoTot = 0;
  RUOLI.forEach(r => {
    const res = residue(r);
    caselle[r] = {vuote: res.length, fasce: res, impegno: impegno(r, infl.valore, -1)};
    vuoteTot += res.length; impegnoTot += caselle[r].impegno;
  });
  return {infl, speso, cassa, caselle, vuoteTot, impegnoTot,
          scoperto: impegnoTot > cassa};
}

/* Il numero. Quanti crediti sono davvero miei, ora, per questa casella.

   Due vincoli, vale il più stretto:
     1. la cassa meno quello che serve per finire tutto il resto al piano;
     2. il pavimento assoluto - ogni casella che resta costa almeno un
        credito, e quel credito non è spendibile qui.
   Il secondo non si viola mai: è la regola che impedisce di finire l'asta
   con quattro caselle vuote e otto crediti in mano. */
function massimo(ruolo, indiceCasella) {
  const q = quadro();
  const res = residue(ruolo);
  if (!res.length) return {valore:0, piena:true, q};

  const i = (indiceCasella == null) ? 0 : indiceCasella;
  const altre = RUOLI.filter(r => r !== ruolo)
                     .reduce((t, r) => t + q.caselle[r].impegno, 0);
  const stessoRuolo = impegno(ruolo, q.infl.valore, i);

  const perPiano = q.cassa - altre - stessoRuolo;
  const pavimento = q.cassa - (q.vuoteTot - 1);
  const valore = Math.max(1, Math.min(perPiano, pavimento));

  return {
    valore, piena:false, q, fascia:res[i],
    riferimento: rifVivo(ruolo, res[i], q.infl.valore),
    impegnoAltrove: altre + stessoRuolo,
    pavimento, perPiano,
    scoperto: q.scoperto
  };
}

/* ------------------------------------------------------------ ACQUISTO
   Comprare non è togliere crediti: è consumare una casella del piano e
   riequilibrare quelle che restano. Se ho pagato più del riferimento, la
   differenza la deve pagare qualcun altro del piano - e il consulente dice
   esattamente chi, senza chiedermelo. */
function scalaFascia(ruolo, quale) {
  const res = S.piano[ruolo];
  if (res[quale] >= 5) return 0;
  const prima = rif(ruolo, res[quale]);
  res[quale]++;
  return prima - rif(ruolo, res[quale]);
}

function riequilibra(ruolo, avanzo) {
  const mosse = [];
  let mancano = avanzo, giri = 0;
  while (mancano > 0 && giri < 200) {
    giri++;
    let scelta = null;
    if (S.regola === 'basso') {
      // paga la casella più bassa dello stesso reparto; finito il reparto,
      // si va sugli altri seguendo la priorità dichiarata.
      const ordine = [ruolo, ...S.priorita.filter(r => r !== ruolo)];
      for (const r of ordine) {
        const res = S.piano[r] || [];
        let peggiore = -1;
        res.forEach((f, i) => { if (f < 5 && (peggiore < 0 || f > res[peggiore])) peggiore = i; });
        if (peggiore >= 0) { scelta = [r, peggiore]; break; }
      }
    } else if (S.regola === 'reparto') {
      for (const r of S.priorita) {
        const res = S.piano[r] || [];
        let peggiore = -1;
        res.forEach((f, i) => { if (f < 5 && (peggiore < 0 || f > res[peggiore])) peggiore = i; });
        if (peggiore >= 0) { scelta = [r, peggiore]; break; }
      }
    } else {
      // proporzionale: paga chi in questo momento vale di più, così il
      // colpo si spalma invece di svuotare un reparto solo.
      let top = null;
      RUOLI.forEach(r => (S.piano[r] || []).forEach((f, i) => {
        if (f < 5 && (!top || rif(r, f) > rif(top[0], S.piano[top[0]][top[1]]))) top = [r, i];
      }));
      scelta = top;
    }
    if (!scelta) break;
    const recuperato = scalaFascia(scelta[0], scelta[1]);
    if (recuperato <= 0) { if (S.piano[scelta[0]][scelta[1]] >= 5) continue; else break; }
    mancano -= recuperato;
    mosse.push({ruolo:scelta[0], fascia:S.piano[scelta[0]][scelta[1]]});
  }
  return {mosse, residuo: Math.max(0, mancano)};
}

/* In una stanza dove dodici persone urlano, vedere non basta per essere sicuri
   che l'acquisto sia andato: il polso lo sente anche senza guardare. */
function tocco(forte) {
  try { navigator.vibrate && navigator.vibrate(forte ? [12, 40, 12] : 14); } catch (e) {}
}

function compra(g, prezzo) {
  const res = S.piano[g.r] || [];
  if (!res.length) return {errore:'Le caselle di questo reparto sono già tutte piene.'};

  // Quale casella sto riempiendo: quella la cui fascia costa più vicino a
  // quanto ho pagato. Se pago 90, sto consumando lo slot da titolare, non
  // uno dei riempitivi.
  const infl = inflazione().valore;
  let quale = 0, scarto = Infinity;
  res.forEach((f, i) => {
    const d = Math.abs(rifVivo(g.r, f, infl) - prezzo);
    if (d < scarto) { scarto = d; quale = i; }
  });

  const fascia = res[quale];
  const riferimento = rifVivo(g.r, fascia, infl);
  res.splice(quale, 1);

  const avanzo = prezzo - riferimento;
  const eco = avanzo > 0 ? riequilibra(g.r, avanzo) : {mosse:[], residuo:0};
  RUOLI.forEach(r => (S.piano[r] || []).sort((a, b) => a - b));

  S.miei.push({id:g.id, nome:g.n, r:g.r, prezzo, fascia});
  delete S.venduti[g.id];
  salva();
  return {fascia, riferimento, avanzo, eco};
}

/* Cancellare la rosa e' irreversibile: si chiede una volta, chiaramente, e
   basta - una seconda domanda dopo la prima e' solo attrito. */
function confermaAzzera() {
  const d = document.createDocumentFragment();
  d.append(E('h3', '', 'Azzerare tutto?'));
  const quanti = S.miei.length, venduti = Object.keys(S.venduti).length;
  d.append(E('div', 'prosa', quanti + venduti === 0
    ? 'Non c\'è ancora niente da cancellare: nessun acquisto, nessuna vendita segnata.'
    : `Si cancellano <b>${quanti} acquisti</b> tuoi e <b>${venduti} prezzi</b> segnati
       degli altri. Budget, caselle e regole del piano restano come li hai messi.
       Non si torna indietro.`));
  const az = E('div', 'azioni');
  if (quanti + venduti > 0) {
    const si = E('button', 'btn pericolo', 'Sì, azzera');
    si.onclick = () => {
      S.miei = []; S.venduti = {};
      rigeneraPiano();
      salva(); chiudi(); scheda = 'asta'; disegna();
    };
    az.append(si);
  }
  const no = E('button', 'btn spento', 'Lascia stare');
  no.onclick = chiudi;
  az.append(no);
  d.append(az);
  foglio(d);
}

/* ------------------------------------------------------------ IL PIANO
   Le fasce non sono percentuali decise a tavolino: sono la fila d'attesa.
   Con dodici squadre, i primi dodici di un ruolo se li spartiscono le
   squadre, uno a testa - quelli sono fascia 1. Il piano dice quante caselle
   voglio a ciascun livello, e si adatta al budget da solo. */
function pianoBase() {
  const p = {};
  RUOLI.forEach(r => { p[r] = new Array(S.slot[r]).fill(5); });
  return p;
}

function costoPiano(p) {
  let t = 0;
  RUOLI.forEach(r => (p[r] || []).forEach(f => t += rif(r, f)));
  return t;
}

/* Tutte le forme possibili di un reparto: quante caselle a ciascuna fascia.
   Con al massimo otto caselle e cinque fasce sono poche centinaia di
   combinazioni - si guardano tutte, invece di indovinare. */
function forme(caselle, fasce, da) {
  da = da || 1;
  if (da === fasce) return [[caselle]];
  const fuori = [];
  for (let q = 0; q <= caselle; q++) {
    forme(caselle - q, fasce, da + 1).forEach(resto => fuori.push([q].concat(resto)));
  }
  return fuori;
}

function rigeneraPiano() {
  const strategia = PIANI[S.strategia];
  const tetto = Math.floor(S.budget * 0.97);
  const p = {};

  RUOLI.forEach(r => {
    const caselle = S.slot[r];
    const quota = Math.floor(tetto * strategia.quota[r]);

    // Si cerca la forma che usa meglio la quota del reparto senza sforarla.
    let migliore = null, spesaTop = 0;
    const candidate = [];
    forme(caselle, 5).forEach(f => {
      let costo = 0;
      f.forEach((q, i) => costo += q * rif(r, i + 1));
      if (costo > quota) return;
      if (f[0] > IN_CAMPO[r]) return;     // niente panchine di fuoriclasse
      candidate.push({f, costo});
      if (costo > spesaTop) spesaTop = costo;
    });

    // Fra quelle che ci vanno vicino, decide la strategia: la corazzata
    // preferisce concentrare in cima, la spalmata distribuire.
    // Fra tutte quelle che usano bene la quota, sceglie la strategia: quanto
    // concentrare in cima invece di spalmare.
    const vicine = candidate.filter(c => c.costo >= spesaTop * 0.80);
    const cima = (x) => x.f[0] * 10 + x.f[1] * 3 + x.f[2];
    vicine.sort((a, b) => {
      const d = (cima(b) - cima(a)) * strategia.cima;
      return d !== 0 ? d : b.costo - a.costo;
    });
    migliore = (vicine[0] || candidate[0] || {f:[0,0,0,0,caselle]}).f;

    const lista = [];
    migliore.forEach((q, i) => { for (let k = 0; k < q; k++) lista.push(i + 1); });
    lista.sort((a, b) => a - b);
    p[r] = lista;
  });

  // Quello che avanza dopo i reparti non si butta: sale dove costa meno.
  for (let giro = 0; giro < 300; giro++) {
    const attuale = costoPiano(p);
    let scelto = null, costo = Infinity;
    RUOLI.forEach(r => p[r].forEach((f, i) => {
      if (f <= 1) return;
      // Vale anche qui: mai piu' titolari veri di quanti se ne schierano.
      if (f === 2 && p[r].filter(x => x === 1).length >= IN_CAMPO[r]) return;
      const c = rif(r, f - 1) - rif(r, f);
      if (c > 0 && c < costo && attuale + c <= tetto) { costo = c; scelto = [r, i]; }
    }));
    if (!scelto) break;
    p[scelto[0]][scelto[1]]--;
    p[scelto[0]].sort((a, b) => a - b);
  }

  S.piano = p;
  return p;
}

/* ============================================================ SCHERMO ACCESO

   Dieci minuti senza toccare il telefono e lo schermo si spegne, di solito
   mentre parte il tuo attaccante. Il permesso lo concede il browser solo su
   richiesta esplicita e lo revoca ogni volta che l'app va in secondo piano:
   va richiesto di nuovo al ritorno, altrimenti dura una volta sola. */
let veglia = null;
async function tieniAcceso(attivo) {
  S.sveglio = attivo;
  salva();
  if (!attivo) { try { veglia && await veglia.release(); } catch (e) {} veglia = null; return; }
  try {
    veglia = await navigator.wakeLock.request('screen');
    veglia.addEventListener('release', () => { veglia = null; });
  } catch (e) { veglia = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.sveglio && !veglia) tieniAcceso(true);
});

/* ============================================================ PASSI INDIETRO

   All'asta si sbaglia in fretta e non si ricorda cosa si e' toccato. Prima di
   ogni azione che cambia la rosa si mette da parte una copia dello stato: si
   torna indietro senza dover ricostruire a mente. Dieci passi bastano - piu'
   in la' non serve, e la memoria del telefono non e' infinita. */
const PASSI = [];
function ricorda() {
  PASSI.push(JSON.stringify({miei: S.miei, venduti: S.venduti, piano: S.piano}));
  if (PASSI.length > 10) PASSI.shift();
}
function passoIndietro() {
  const prima = PASSI.pop();
  if (!prima) return;
  const o = JSON.parse(prima);
  S.miei = o.miei; S.venduti = o.venduti; S.piano = o.piano;
  salva(); chiudi(); disegna();
}

/* ============================================================ USCITA

   Chiudere la scheda per sbaglio a meta' asta significa affidarsi a quello che
   il browser ha salvato, e i browser liberano memoria quando vogliono. Un
   avviso costa un tocco e vale due ore di lavoro. */
window.addEventListener('beforeunload', e => {
  if (S.miei.length || Object.keys(S.venduti).length) { e.preventDefault(); e.returnValue = ''; }
});

/* ============================================================ SALVATAGGIO */
let inSalvataggio = null;
function salva() {
  clearTimeout(inSalvataggio);
  inSalvataggio = setTimeout(() => Deposito.scrivi(S), 120);
}

async function ripristina() {
  const o = await Deposito.leggi();
  if (o && o.miei) {
    S = Object.assign(S, o);
    if (!S.piano) rigeneraPiano();
  } else {
    rigeneraPiano();
  }
}

/* ============================================================ VISTE */
const E = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c;
  if (h != null) n.innerHTML = h; return n; };
const $ = s => document.querySelector(s);

function disegna() {
  riIndicizza();
  const q = quadro();
  $('#hCassa').textContent = q.cassa;
  $('#hCaselle').textContent = q.vuoteTot;
  $('#hInfl').textContent = q.infl.pronta
    ? (q.infl.valore >= 1 ? '+' : '') + Math.round((q.infl.valore - 1) * 100) + '%'
    : '—';
  $('#hInfl').style.color = q.infl.pronta
    ? (q.infl.valore > 1.12 ? 'var(--allarme)' : q.infl.valore < 0.9 ? 'var(--verde)' : 'var(--testo)')
    : 'var(--tenue)';

  // La scheda attiva si accende subito, prima di costruire qualunque nodo:
  // altrimenti il dito preme e per un attimo non succede niente, ed e' quel
  // vuoto che fa sembrare lenta l'app.
  document.querySelectorAll('nav button').forEach(b =>
    b.classList.toggle('on', b.dataset.t === scheda));
  $('#annulla').hidden = PASSI.length === 0;

  const v = $('#vista');
  const nuova = scheda === 'asta' ? vistaAsta(q)
              : scheda === 'listone' ? vistaListone()
              : vistaPiano();
  // Un solo scambio di contenuto: svuotare e riempire sono due riflussi, la
  // sostituzione in blocco e' uno.
  v.replaceChildren(nuova);
  v.scrollTop = 0;
}

/* ------------------------------------------------------------ ASTA */
function vistaAsta(q) {
  const f = document.createDocumentFragment();
  const m = massimo(S.ruoloAttivo, 0);

  const banco = E('div', 'banco');

  const ruoli = E('div', 'ruoli');
  RUOLI.forEach(r => {
    const vuote = q.caselle[r].vuote;
    const b = E('button', (r === S.ruoloAttivo ? 'on ' : '') + (vuote ? '' : 'pieno'),
      `${r}<span class="mini">${vuote ? vuote + ' da fare' : 'completo'}</span>`);
    b.onclick = () => { S.ruoloAttivo = r; salva(); disegna(); };
    ruoli.append(b);
  });
  banco.append(ruoli);

  const cif = E('div', 'cifra' + (m.scoperto ? ' rosso' : ''));
  if (m.piena) {
    cif.innerHTML = `<div class="et">Reparto completo</div>
      <div class="n">✓</div>
      <div class="um">non ti serve altro qui</div>`;
  } else {
    cif.innerHTML = `<div class="et">Puoi arrivare a</div>
      <div class="n">${m.valore}</div>
      <div class="um">crediti</div>`;
  }
  banco.append(cif);

  // Da dove esce quel numero. Un tetto che non sai spiegare non lo rispetti:
  // a meta' asta, se non torna, lo sfori e basta.
  if (!m.piena) {
    const altre = q.vuoteTot - 1;
    const serve = m.impegnoAltrove;
    const fascia1 = m.fascia === 1
      ? `i primi ${S.squadre} del ruolo, uno per squadra`
      : `dal ${(m.fascia - 1) * S.squadre + 1}° al ${m.fascia * S.squadre}° del ruolo`;
    const conto = E('div', 'conto');
    conto.innerHTML = `
      Hai <b>${q.cassa}</b> crediti in cassa. Ne servono <b>${serve}</b> per riempire
      le altre <b>${altre}</b> caselle al livello che hai messo nel piano.
      Il resto puoi spenderlo qui, ora.
      <span class="perche">Il piano teneva da parte <b>${m.riferimento}</b> crediti per
        questo posto: ${NOME_RUOLO[S.ruoloAttivo].toLowerCase().replace(/i$/, 'o')} di
        <b>fascia ${m.fascia}</b> — ${fascia1}. Se paghi di più,
        una casella scende di livello.</span>`;
    banco.append(conto);

    // Quanto puoi permetterti di aspettare. E' l'unica lettura sugli avversari
    // che regge davvero: non chi ha i crediti, ma quante caselle come questa
    // restano scoperte in tutta la stanza.
    const sc = scarsita(S.ruoloAttivo);
    const nome = NOME_RUOLO[S.ruoloAttivo].toLowerCase();
    const stretto = sc.altrui <= S.squadre;
    banco.append(E('div', 'scarso' + (stretto ? ' stretta' : ''),
      sc.restano === 0
        ? `In tutta la lega non resta nessuna casella da ${nome}: l'asta di questo reparto è finita.`
        : `Nella lega restano <b>${sc.restano} caselle</b> da ${nome} su ${sc.totale}${
            sc.mie ? `, di cui ${sc.mie} tue` : ''}. ${
            stretto ? 'Se ne stanno liberando poche: aspettare costa.'
                    : 'Ce n\'è ancora per tutti: puoi aspettare.'}`));
  }


  // La barra di cassa: speso, impegnato dal piano, libero. È l'estratto conto.
  const libero = Math.max(0, q.cassa - q.impegnoTot);
  const tot = Math.max(1, S.budget);
  const barra = E('div', 'cassa');
  const seg = (w, col) => { const i = document.createElement('i');
    i.style.width = (w / tot * 100) + '%'; i.style.background = col; return i; };
  barra.append(seg(q.speso, 'var(--verde)'));
  barra.append(seg(Math.min(q.impegnoTot, q.cassa), 'var(--oro)'));
  barra.append(seg(libero, 'var(--rilievo)'));
  banco.append(barra);
  banco.append(E('div', 'legenda',
    `<span><i class="pallino" style="background:var(--verde)"></i>già spesi ${q.speso}</span>
     <span><i class="pallino" style="background:var(--oro)"></i>servono dopo ${q.impegnoTot}</span>
     <span><i class="pallino" style="background:var(--rilievo)"></i>margine ${libero}</span>`));
  f.append(banco);

  if (q.scoperto) {
    f.append(E('div', 'avviso', `<b>Sei sotto il piano.</b> Per finire la rosa ai prezzi
      di stasera servirebbero ${q.impegnoTot} crediti e ne hai ${q.cassa}. Da qui in poi
      ogni casella scende di fascia: compra sotto il riferimento o rinuncia a un titolare.`));
  } else if (q.infl.pronta && q.infl.valore > 1.15) {
    f.append(E('div', 'avviso calmo', `L'asta sta pagando il <b>${Math.round((q.infl.valore-1)*100)}%
      sopra il listino</b>. I riferimenti qui sopra sono già stati rialzati: se compri al
      listino di agosto, stai comprando bene.`));
  } else if (q.infl.pronta && q.infl.valore < 0.9) {
    f.append(E('div', 'avviso calmo', `L'asta sta pagando <b>sotto il listino</b>. I riferimenti
      sono stati abbassati: tieni i crediti, più avanti costano meno.`));
  }

  // Le caselle: cosa ho, cosa manca, a che livello.
  f.append(E('div', 'sez', `<h2>La rosa</h2><span class="nota">verde = preso · grigio = fascia prevista</span>`));
  RUOLI.forEach(r => {
    const riga = E('div', 'riga');
    riga.append(E('div', 'rl', r));
    const c = E('div', 'caselle');
    S.miei.filter(a => a.r === r).forEach((a, i) => {
      const el = E('div', 'cs presa', a.prezzo);
      el.title = a.nome;
      el.onclick = () => apriPreso(INDICE[a.id] || {id:a.id, n:a.nome, r:a.r});
      c.append(el);
    });
    residue(r).forEach(fa => c.append(E('div', 'cs vuota', 'F' + fa)));
    riga.append(c);
    riga.append(E('div', 'tot', S.miei.filter(a => a.r === r)
      .reduce((t, a) => t + a.prezzo, 0)));
    f.append(riga);
  });

  const az = E('div', 'azioni');
  const b1 = E('button', 'btn primo', 'Ho comprato');
  b1.onclick = () => apriRicerca('mio');
  const b2 = E('button', 'btn spento', 'Venduto ad altri');
  b2.onclick = () => apriRicerca('altri');
  az.append(b1, b2);
  f.append(az);

  // Il piano B: chi resta, allo stesso prezzo, se questo me lo soffiano.
  if (!m.piena) {
    const alt = alternative(S.ruoloAttivo, m.fascia, 5);
    f.append(E('div', 'sez', `<h2>Se lo perdo</h2>
      <span class="nota">liberi, fascia ${m.fascia}</span>`));
    if (!alt.length) {
      f.append(E('div', 'vuoto', 'Non è rimasto nessuno in questa fascia. La casella scende di livello.'));
    } else {
      alt.forEach(g => f.append(rigaGiocatore(g)));
    }
  }
  return f;
}

/* Chiamata una volta per riga disegnata, cioe' centinaia di volte a ridisegno:
   scorrere la rosa ogni volta e' lavoro inutile quando basta un insieme. */
let MIEI_ID = new Set();
function riIndicizza() { MIEI_ID = new Set(S.miei.map(a => a.id)); }
function preso(id) { return S.venduti[id] != null || MIEI_ID.has(id); }

/* La faccia. Serve a riconoscere il nome in mezzo secondo mentre il banditore
   grida: leggere "Esposito Se." e capire quale sia costa piu' tempo di quanto
   l'asta ne conceda. Se la rete non c'e', restano le iniziali - la casella non
   si muove e la pagina non aspetta. */
const FOTO = 'https://content.fantacalcio.it/web/campioncini/21/card/';

/* Le sigle si calcolano una volta sola: sono 501 e non cambiano mai. */
const SIGLE = {};
DATI.giocatori.forEach(g => SIGLE[g.id] = g.n.replace(/[^A-Za-zÀ-ÿ ]/g, '')
  .trim().split(/\s+/).map(p => p[0]).join('').slice(0, 2).toUpperCase());

/* Chi ha gia' fallito non si ritenta: senza rete, all'asta, sarebbero 80
   richieste morte a ogni lettera digitata nella ricerca. */
const FOTO_ROTTE = new Set();

/* Le figurine escono tutte dallo stesso modello, quindi hanno la stessa
   proporzione: basta misurarla sulla prima che arriva e tutte le altre
   possono riservare lo spazio giusto prima ancora di caricarsi. */
let FORMA = null;
function imparaForma(img) {
  if (FORMA || !img.naturalWidth || !img.naturalHeight) return;
  FORMA = img.naturalWidth / img.naturalHeight;
  document.documentElement.style.setProperty('--forma-figurina', FORMA.toFixed(4));
}

function faccia(g, grande) {
  const el = E('div', 'faccia' + (grande ? ' grande' : ''));
  el.append(E('span', '', SIGLE[g.id] || '?'));
  if (FOTO_ROTTE.has(g.id)) return el;
  // Un <img> nel documento con loading="lazy" lo scarica il browser, una volta
  // sola, e solo se la riga e' davvero sullo schermo. new Image() invece
  // partiva subito, per tutte e ottanta le righe, a ogni ridisegno.
  const img = document.createElement('img');
  img.alt = '';
  img.loading = 'lazy';
  img.decoding = 'async';
  img.onload = () => { imparaForma(img); img.classList.add('c'); };
  img.onerror = () => { FOTO_ROTTE.add(g.id); img.remove(); };
  img.src = FOTO + g.id + '.png?v=647';
  el.append(img);
  return el;
}

/* L'ordine per convenienza non cambia finche' non cambiano le regole della
   lega: si calcola una volta e si riusa, invece di riordinare cinquecento
   giocatori ogni volta che tocchi qualcosa. */
let ORDINE_CACHE = null, ORDINE_CHIAVE = null;
function ordinati() {
  const chiave = String(S.modificatore);
  if (ORDINE_CHIAVE !== chiave) {
    ORDINE_CACHE = DATI.giocatori.slice()
      .sort((a, b) => (vantaggioDi(b).valore ?? -9) - (vantaggioDi(a).valore ?? -9));
    ORDINE_CHIAVE = chiave;
  }
  return ORDINE_CACHE;
}

function alternative(ruolo, fascia, quanti) {
  // Gia' in ordine di convenienza: si scorre finche' non se ne sono trovati
  // abbastanza, senza toccare il resto della lista.
  const fuori = [];
  const tutti = ordinati();
  for (let i = 0; i < tutti.length && fuori.length < quanti; i++) {
    const g = tutti[i];
    if (g.r === ruolo && g.f === fascia && !preso(g.id) && !(g.out && g.out.grave))
      fuori.push(g);
  }
  return fuori;
}

/* Ottanta righe ricostruite a ogni lettera digitata sono ottanta creazioni di
   nodi mentre il dito e' ancora sulla tastiera. Aspettare che le lettere
   finiscano costa un attimo e restituisce la fluidita'. */
let attesa = null;
function aggiornaListaTraPoco() {
  clearTimeout(attesa);
  attesa = setTimeout(aggiornaLista, 120);
}

function aggiornaLista() {
  const cont = document.getElementById('lista');
  if (!cont) return;
  const t = piatto(filtro.testo.trim());
  let ls = DATI.giocatori.filter(g => {
    if (filtro.ruolo && g.r !== filtro.ruolo) return false;
    if (filtro.soloLiberi && preso(g.id)) return false;
    if (filtro.sani && g.out && g.out.grave) return false;
    if (t && !g._c.includes(t)) return false;
    return true;
  });
  if (filtro.ordine === 'v') {
    const posto = new Map(ordinati().map((g, i) => [g.id, i]));
    ls.sort((a, b) => posto.get(a.id) - posto.get(b.id));
  } else {
    const chiave = {p: g => g.p, c: g => g.c ?? -9, y: g => g.y ?? -9}[filtro.ordine];
    ls.sort((a, b) => chiave(b) - chiave(a));
  }
  cont.innerHTML = '';
  if (!ls.length) { cont.append(E('div', 'vuoto', 'Nessun giocatore con questi filtri.')); return; }

  // Si disegna un blocco per volta, e il successivo solo quando arrivi in
  // fondo: sullo schermo ne stanno una decina, costruirne ottanta e' lavoro
  // buttato che si paga in attesa.
  const PASSO = 25;
  let quanti = 0;
  const altri = E('div', 'ancora');
  const disegnaBlocco = () => {
    const pezzo = document.createDocumentFragment();
    ls.slice(quanti, quanti + PASSO).forEach(g => pezzo.append(rigaGiocatore(g)));
    quanti += PASSO;
    cont.insertBefore(pezzo, altri);
    if (quanti >= ls.length) altri.remove();
    else altri.textContent = `Mostra altri ${Math.min(PASSO, ls.length - quanti)}` +
      ` (ne restano ${ls.length - quanti})`;
  };
  altri.onclick = disegnaBlocco;
  cont.append(altri);
  disegnaBlocco();
}

/* Una differenza di fantamedia non si sente: +0.62 non vuol dire niente a
   nessuno. Moltiplicata per le giornate diventa la cosa che conta davvero -
   i punti che quel giocatore ti mette in classifica in piu' di un altro che
   costa uguale. Quello si capisce senza spiegazioni. */
function inPunti(vantaggio) { return Math.round(vantaggio * 38); }

/* Col modificatore di difesa il metro per portieri e difensori e' la media
   voto, non la fantamedia. Chi decide quale confronto vale non e' l'app: e'
   il regolamento della lega, e sta nel Piano. */
function vantaggioDi(g) {
  if (S.modificatore && (g.r === 'P' || g.r === 'D') && g.vm != null)
    return {valore: g.vm, voto: true};
  return {valore: g.v, voto: false};
}

function etichettaVantaggio(g) {
  const v = vantaggioDi(g);
  if (v.valore == null) return null;
  return v.voto
    ? {testo: `${v.valore >= 0 ? '+' : ''}${v.valore.toFixed(2)} di voto a pari prezzo`,
       forte: v.valore >= 0.12, debole: v.valore <= -0.12}
    : {testo: `${inPunti(v.valore) >= 0 ? '+' : ''}${inPunti(v.valore)} punti a pari prezzo`,
       forte: inPunti(v.valore) >= 8, debole: inPunti(v.valore) <= -8};
}

function rigaGiocatore(g) {
  const el = E('div', 'g' + (preso(g.id) ? ' via' : '') + (g.out && g.out.grave ? ' assente' : ''));
  const tag = [];
  // Chi e' fuori adesso viene prima di tutto: e' l'unica cosa del file che
  // parla di oggi, e una casella vuota per due mesi costa piu' di qualunque
  // fantamedia.
  if (g.out) tag.push(`<span class="tag fuori">fuori ora: ${g.out.motivo}</span>`);
  if (g.f === 1) tag.push('<span class="tag f1">fascia 1</span>');
  else tag.push(`<span class="tag">F${g.f}</span>`);
  if (g.c == null) tag.push('<span class="tag ignoto">nessuno storico</span>');
  // Se il punteggio e' basso per un motivo che non e' scarsa affidabilita',
  // va detto qui: altrimenti la riga mente.
  else if (g.nc && g.nc[0] && g.nc[0].startsWith('Ha cambiato'))
    tag.push('<span class="tag">arrivato a stagione in corso</span>');
  // Quattro rigori calciati in una stagione sono un incarico; uno solo e' un
  // caso. Il numero lo dice da se', senza etichette da interpretare.
  if (g.rc >= 4) tag.push(`<span class="tag rig">${g.rc} rigori calciati</span>`);
  if (g.rp >= 2) tag.push(`<span class="tag rig">${g.rp} rigori parati</span>`);
  const et = etichettaVantaggio(g);
  if (et && et.forte && g.c != null && g.c >= 75)
    tag.push(`<span class="tag buono">${et.testo}</span>`);

  const barra = g.c == null ? '' :
    `<span class="barrina"><i style="width:${g.c}%;background:${g.c >= 80 ? 'var(--verde)' : g.c >= 55 ? 'var(--oro)' : 'var(--allarme)'}"></i></span>`;

  el.append(faccia(g));
  const id = E('div', 'id', `<div class="nm">${g.n}</div>
    <div class="sq">${g.s} ${barra} ${tag.join(' ')}</div>`);
  el.append(id);
  el.append(E('div', 'pz', `${g.p}<small>listino</small>`));
  el.onclick = () => apriGiocatore(g);
  return el;
}

function campoNumero(et, val, fn, aiuto) {
  const c = E('div', 'campo');
  c.innerHTML = `<div><label>${et}</label>${aiuto ? `<div class="aiuto">${aiuto}</div>` : ''}</div>`;
  const i = document.createElement('input');
  // type="number" su iOS porta con se' le frecce e un tocco che ingrandisce;
  // il tipo testo con tastiera numerica da' gli stessi numeri e nessun effetto.
  i.type = 'text'; i.inputMode = 'numeric'; i.value = val;
  i.onchange = e => { const v = parseInt(e.target.value, 10);
    if (v > 0) { fn(v); salva(); disegna(); } };
  c.append(i);
  return c;
}

function fasciera(r) {
  const c = E('div', 'fasciera');
  const conteggio = {};
  (S.piano[r] || []).forEach(f => conteggio[f] = (conteggio[f] || 0) + 1);
  const presi = S.miei.filter(a => a.r === r).length;
  const costo = (S.piano[r] || []).reduce((t, f) => t + rif(r, f), 0);
  c.append(E('div', 'cap', `<b>${NOME_RUOLO[r]}</b>
    <span>${presi} presi · ${(S.piano[r] || []).length} da fare · ${costo} cr</span>`));
  for (let f = 1; f <= 5; f++) {
    const l = E('div', 'livello');
    l.innerHTML = `<span class="nome">Fascia ${f} <i>~${rif(r, f)} cr</i></span>`;
    const meno = E('button', '', '−');
    const cnt = E('div', 'cnt', String(conteggio[f] || 0));
    const piu = E('button', '', '+');
    meno.onclick = () => { declassa(r, f); };
    piu.onclick = () => { promuovi(r, f); };
    l.append(meno, cnt, piu);
    c.append(l);
  }
  return c;
}

/* Muovere una casella significa spostarla di livello, non aggiungerla: quante
   caselle hai lo decide la rosa, non tu. Il + prende la casella buona più
   vicina sotto e la porta qui; il − manda una di queste un gradino più giù. */
function declassa(r, fascia) {
  const lista = S.piano[r] || [];
  const i = lista.indexOf(fascia);
  if (i < 0 || fascia >= 5) return;
  lista[i] = fascia + 1;
  lista.sort((a, b) => a - b);
  salva(); disegna();
}

function promuovi(r, fascia) {
  const lista = S.piano[r] || [];
  let scelto = -1;
  for (let f = fascia + 1; f <= 5; f++) {
    const i = lista.indexOf(f);
    if (i >= 0) { scelto = i; break; }
  }
  if (scelto < 0) return;
  lista[scelto] = fascia;
  lista.sort((a, b) => a - b);
  salva(); disegna();
}

/* Un tap sbagliato non deve costare il giocatore. Chi e' segnato come venduto
   ad altri si rimette in lista; chi ho comprato io cambia prezzo senza
   doverlo cancellare e ricomprare. */
/* Alzare un'offerta da 40 a 60 sono venti tocchi, e venti tocchi in fretta
   sono dieci occasioni per il browser di interpretarli come richieste di
   zoom. Tenendo premuto il numero sale da solo, sempre piu' in fretta: un
   dito fermo, nessun doppio tocco possibile. */
function ripetibile(bottone, passo) {
  let timer = null, ritmo = null, colpi = 0;
  const fermati = () => { clearTimeout(timer); clearInterval(ritmo); colpi = 0; };
  const parti = e => {
    e.preventDefault();
    passo();
    timer = setTimeout(() => {
      ritmo = setInterval(() => {
        colpi++;
        // dopo un secondo di pressione si sale a cinque per volta
        const salti = colpi > 12 ? 5 : 1;
        for (let i = 0; i < salti; i++) passo();
      }, 80);
    }, 400);
  };
  bottone.addEventListener('pointerdown', parti);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
    bottone.addEventListener(ev, fermati));
  return bottone;
}

function apriPreso(g) {
  const mio = S.miei.find(a => a.id === g.id);
  const d = document.createDocumentFragment();
  const testata = E('div', 'testata');
  testata.append(faccia(g, true));
  testata.append(E('div', '', `<h3>${g.n}</h3>
    <div class="oc" style="margin:0">${mio ? `l'hai preso tu per ${mio.prezzo} crediti`
      : `venduto a un altro per ${S.venduti[g.id]} crediti`}</div>`));
  d.append(testata);

  if (mio) {
    d.append(E('div', 'prosa', `Se hai sbagliato a segnare il prezzo, correggilo qui: il
      piano si ricalcola da zero come se l'avessi pagato così fin dall'inizio.`));
    const sp = E('div', 'spesa');
    const inp = document.createElement('input');
    inp.type = 'text'; inp.inputMode = 'numeric'; inp.value = mio.prezzo;
    const meno = ripetibile(E('button', '', '−'),
      () => { inp.value = Math.max(1, (+inp.value || 1) - 1); });
    const piu = ripetibile(E('button', '', '+'),
      () => { inp.value = (+inp.value || 0) + 1; });
    sp.append(meno, inp, piu);
    d.append(sp);
    const az = E('div', 'azioni');
    const b1 = E('button', 'btn primo', 'Correggi il prezzo');
    b1.onclick = () => {
      const nuovo = Math.max(1, parseInt(inp.value, 10) || 1);
      riscrivi(S.miei.map(a => a.id === g.id ? Object.assign({}, a, {prezzo: nuovo}) : a));
      chiudi(); disegna();
    };
    const b2 = E('button', 'btn spento', 'Annulla l\'acquisto');
    b2.onclick = () => {
      riscrivi(S.miei.filter(a => a.id !== g.id));
      chiudi(); disegna();
    };
    az.append(b1, b2);
    d.append(az);
  } else {
    d.append(E('div', 'prosa', 'Rimettendolo in lista torna disponibile e il suo prezzo esce dal conto dell\'inflazione.'));
    const az = E('div', 'azioni');
    const b = E('button', 'btn primo', 'Rimettilo in lista');
    b.onclick = () => { ricorda(); delete S.venduti[g.id]; salva(); chiudi(); disegna(); };
    az.append(b);
    d.append(az);
  }
  foglio(d);
}

/* Rifare il piano da capo e riconsumare gli acquisti nell'ordine e' piu'
   onesto che indovinare quale fascia rimettere a posto: il risultato non
   dipende da come ci sei arrivato. */
function riscrivi(acquisti) {
  ricorda();
  S.miei = [];
  rigeneraPiano();
  acquisti.forEach(x => { const g = INDICE[x.id]; if (g) compra(g, x.prezzo); });
  salva();
}

function apriGiocatore(g, modo) {
  if (preso(g.id)) return apriPreso(g);
  const d = document.createDocumentFragment();
  const testata = E('div', 'testata');
  testata.append(faccia(g, true));
  testata.append(E('div', '', `<h3>${g.n}</h3>
    <div class="oc" style="margin:0">${g.pos || NOME_RUOLO[g.r].replace(/i$/, 'o')} del ${g.s}<br>
    listino ${g.p} crediti · fascia ${g.f}</div>`));
  d.append(testata);

  // Prima di ogni statistica: e' disponibile oggi?
  if (g.out) {
    d.append(E('div', 'fuoriora', `<b>Fuori adesso</b> per ${g.out.motivo}${
      g.out.dal ? `, dal ${g.out.dal.split('-').reverse().join('/')}` : ''}.
      ${g.out.grave ? 'Comprarlo significa una casella vuota finché non rientra.'
                    : 'Salta poco: pesa meno di un infortunio.'}`));
  }

  const fatti = E('div', 'fatti');
  const f = (et, vl, col) => `<div class="fatto"><div class="et">${et}</div>
    <div class="vl" ${col ? `style="color:${col}"` : ''}>${vl}</div></div>`;
  // Un portiere e un attaccante non si giudicano sulle stesse colonne: i gol
  // subiti valgono per uno e non esistono per l'altro.
  const comuni =
    f('Affidabilità', g.c == null ? 'ignota' : g.c + '/100',
      g.c == null ? 'var(--allarme)' : g.c >= 80 ? 'var(--verde)' : g.c >= 55 ? 'var(--oro)' : 'var(--allarme)') +
    f('Partite', g.pv ? g.pv + '/38' : 'mai') +
    f('Fantamedia', g.fm ?? '—');
  fatti.innerHTML = g.r === 'P'
    ? comuni +
      f('Gol subiti', g.gs != null ? g.gs : '—',
        g.gs == null ? null : g.gs <= 1.0 ? 'var(--verde)' : g.gs >= 1.5 ? 'var(--allarme)' : null) +
      f('Rigori parati', g.rp || '—', g.rp ? 'var(--acqua)' : null) +
      f('Media voto', g.mvp ?? '—')
    : comuni +
      f('Gol', g.pv ? g.g : '—') +
      f('Assist', g.pv ? g.a : '—') +
      f('Malus a partita', g.ml != null ? '−' + g.ml : '—',
        g.ml != null && g.ml >= 0.35 ? 'var(--allarme)' : null);
  d.append(fatti);

  // Solo fatti, in prosa, con le unita' di misura scritte. Niente pronostici:
  // quello che non si sa si dice che non si sa.
  const righe = [];
  if (g.c == null) {
    righe.push(`<b>Non ci sono dati utili su di lui.</b> Neopromosso, arrivato da fuori o mai
      impiegato: qualunque cifra sulla sua stagione sarebbe inventata. Trattalo come una
      scommessa e mettici il minimo.`);
  }

  if (g.pos && g.pv > 0) {
    righe.push(g.bn
      ? `Gioca da <b>${g.pos}</b>: è una posizione dove i bonus arrivano.`
      : `Gioca da <b>${g.pos}</b>: è una posizione che raramente porta bonus, il valore
         sta nel voto e nella continuità.`);
  }
  if (g.r === 'P' && g.gs != null) {
    righe.push(g.gs <= 1.0
      ? `Prende <b>${g.gs} gol a partita</b>: fra i meno battuti del campionato, e per un
         portiere è la cosa che conta più di tutte.`
      : `Prende <b>${g.gs} gol a partita</b>${g.gs >= 1.5 ? ': la sua difesa lo espone parecchio.' : '.'}`);
  }
  if (g.ml != null && g.ml >= 0.35) righe.push(`Pesante di cartellini: <b>−${g.ml} punti a
    partita</b> solo di ammonizioni ed espulsioni, cioè ${Math.round(g.ml * 38)} punti
    su una stagione.`);
  if (g.rc >= 4) righe.push(`Ha calciato <b>${g.rc} rigori</b>${g.rs ? `, segnandone ${g.rs}` : ''}:
    è l'incaricato della sua squadra, e i rigori portano bonus anche nelle domeniche storte.`);
  else if (g.rc >= 1) righe.push(`Ha calciato ${g.rc} rigor${g.rc > 1 ? 'i' : 'e'}: troppo pochi
    per essere il rigorista designato.`);
  if (g.rp >= 1) righe.push(`Ha parato <b>${g.rp} rigor${g.rp > 1 ? 'i' : 'e'}</b>, che per un
    portiere valgono tre punti l'uno.`);

  const conf = etichettaVantaggio(g);
  if (conf) {
    const seg = conf.forte ? 'var(--verde)' : conf.debole ? 'var(--allarme)' : 'var(--fioco)';
    const v = vantaggioDi(g);
    righe.push(`Confrontato con gli altri ${NOME_RUOLO[g.r].toLowerCase()} che costano più o
      meno come lui, ${v.voto ? 'la sua media voto è' : 'su una stagione intera ti darebbe'}
      <b style="color:${seg}">${v.voto ? conf.testo.split(' di voto')[0]
        : (inPunti(v.valore) >= 0 ? '+' : '') + inPunti(v.valore) + ' punti'}</b>${
      v.voto ? ' più alta' : ''}${
      g.vc != null && Math.abs(g.vc) >= 8
        ? ` e gioca ${g.vc > 0 ? 'più' : 'meno'} spesso di loro` : ''}.
      A parità di crediti spesi, è ${conf.forte ? 'il posto migliore dove metterli'
      : conf.debole ? 'il peggiore' : 'più o meno uguale agli altri'}.`);
  }
  // Il punteggio da solo non basta: 39 su 100 sembra un panchinaro anche
  // quando e' arrivato a gennaio e ha giocato tutto. I motivi vanno scritti,
  // uno per riga, prima di ogni altra cosa.
  if (g.nc && g.nc.length) {
    const p = E('div', 'motivi');
    p.innerHTML = g.nc.map(x => `<div class="mot">${x}</div>`).join('');
    d.append(p);
  }
  if (righe.length) d.append(E('div', 'prosa', righe.join(' ')));

  // Quanto posso permettermelo davvero, adesso.
  const m = massimo(g.r, 0);
  if (!m.piena) {
    const ok = m.valore >= g.p;
    d.append(E('div', 'avviso' + (ok ? ' calmo' : ''),
      ok ? `Puoi arrivare a <b>${m.valore}</b>. Il listino dice ${g.p}: sei coperto.`
         : `Puoi arrivare a <b>${m.valore}</b>, il listino dice ${g.p}. Se lo prendi
            comunque, qualche casella scende di fascia.`));
  }

  let prezzo = Math.max(1, g.p);
  const sp = E('div', 'spesa');
  const inp = document.createElement('input');
  inp.type = 'text'; inp.inputMode = 'numeric'; inp.value = prezzo;

  /* Digitare 150 invece di 15 e' un errore da un tasto, e l'app lo accetterebbe
     riscrivendo tutto il piano. Il controllo sta qui, mentre il numero cambia,
     non dopo. Non blocca: se vuoi davvero pagarlo, lo paghi - ma lo sai. */
  const spia = E('div', 'spia');
  const controlla = () => {
    const p = Math.max(1, parseInt(inp.value, 10) || 1);
    const rapporto = p / Math.max(1, g.p);
    inp.classList.toggle('caro', rapporto >= 2.5);
    if (rapporto >= 4 && p >= 20)
      spia.innerHTML = `<b>Quattro volte il listino.</b> Hai digitato ${p} dove il listino
        dice ${g.p}: se è un tasto di troppo, ora è il momento di accorgersene.`;
    else if (p > S.budget - S.miei.reduce((t, a) => t + a.prezzo, 0))
      spia.innerHTML = `<b>Non hai questi crediti.</b> In cassa ne restano
        ${S.budget - S.miei.reduce((t, a) => t + a.prezzo, 0)}.`;
    else if (rapporto >= 2.5)
      spia.innerHTML = `Più del doppio del listino (${g.p}).`;
    else spia.innerHTML = '';
    spia.classList.toggle('viva', spia.innerHTML !== '');
  };
  inp.oninput = controlla;

  const meno = ripetibile(E('button', '', '−'),
    () => { inp.value = Math.max(1, (+inp.value || 1) - 1); controlla(); });
  const piu = ripetibile(E('button', '', '+'),
    () => { inp.value = (+inp.value || 0) + 1; controlla(); });
  sp.append(meno, inp, piu);
  d.append(sp);
  d.append(spia);

  // Le tre cifre che si digitano davvero: il listino, e i due rilanci tipici.
  const scorci = E('div', 'scorci');
  [['listino', g.p], ['+50%', Math.round(g.p * 1.5)], ['×2', g.p * 2]]
    .forEach(([et, v]) => {
      const b = E('button', '', `${et} · ${Math.max(1, v)}`);
      b.onclick = () => { inp.value = Math.max(1, v); controlla(); };
      scorci.append(b);
    });
  d.append(scorci);

  const az = E('div', 'azioni');
  if (modo !== 'altri') {
    const b1 = E('button', 'btn primo', 'L\'ho preso io');
    b1.onclick = () => {
      const p = Math.max(1, parseInt(inp.value, 10) || 1);
      ricorda();
      const esito = compra(g, p);
      chiudi();
      if (esito.errore) { PASSI.pop(); avvisa(esito.errore); }
      else {
        tocco(true);
        S.ruoloAttivo = g.r; scheda = 'asta'; disegna(); mostraEsito(g, p, esito);
      }
    };
    az.append(b1);
  }
  const b2 = E('button', 'btn spento', 'Preso da un altro');
  b2.onclick = () => {
    ricorda();
    S.venduti[g.id] = Math.max(1, parseInt(inp.value, 10) || 1);
    tocco(false);
    salva(); chiudi(); disegna();
    // Chi segna le vendite altrui ne segna una dietro l'altra: la ricerca
    // riparte da sola, senza tornare indietro di due schermate.
    if (modo === 'altri') setTimeout(() => apriRicerca('altri'), 60);
  };
  az.append(b2);
  d.append(az);
  foglio(d);
}

function mostraEsito(g, prezzo, esito) {

  d.append(E('h3', '', `${g.n}, ${prezzo} crediti`));
  d.append(E('div', 'oc', `Casella di fascia ${esito.fascia} — il piano ne prevedeva ${esito.riferimento}.`));

  const m = massimo(S.ruoloAttivo, 0);
  const q = m.q;
  if (esito.avanzo > 0) {
    const conto = {};
    esito.eco.mosse.forEach(x => conto[x.ruolo] = (conto[x.ruolo] || 0) + 1);
    const chi = Object.entries(conto).map(([r, n]) =>
      `${n} casella${n > 1 ? 'e' : ''} in ${NOME_RUOLO[r].toLowerCase()}`).join(', ');
    d.append(E('div', 'prosa', esito.eco.mosse.length
      ? `Hai speso <b>${esito.avanzo} sopra il piano</b>. Li ho recuperati abbassando di
         fascia ${chi}.${esito.eco.residuo ? ` Restano <b>${esito.eco.residuo}</b> scoperti:
         non c'è più niente da abbassare.` : ''}`
      : `Hai speso <b>${esito.avanzo} sopra il piano</b> e non c'è più niente da abbassare.
         Le prossime caselle vanno prese al minimo.`));
  } else if (esito.avanzo < 0) {
    d.append(E('div', 'prosa', `Hai risparmiato <b>${-esito.avanzo} crediti</b> sul piano.
      Sono tornati in cassa e allargano le caselle che restano.`));

  const fatti = E('div', 'fatti');

    `<div class="fatto"><div class="et">Ti restano</div>
       <div class="vl">${q.cassa}<span style="font-size:10px;color:var(--tenue)"> cr</span></div></div>
     <div class="fatto"><div class="et">Da comprare</div><div class="vl">${q.vuoteTot}</div></div>
     <div class="fatto"><div class="et">Prossimo tetto</div>
       <div class="vl" style="color:var(--oro)">${m.piena ? '—' : m.valore}</div></div>`;

/* A fine asta serve una cosa sola: la rosa in chiaro, da incollare in chat o
   nel gestionale della lega. Non un file da interpretare - righe leggibili. */
function riepilogo() {
  const righe = ['+3 — rosa finale', ''];
  let totale = 0;
  RUOLI.forEach(r => {
    const miei = S.miei.filter(a => a.r === r).sort((a, b) => b.prezzo - a.prezzo);
    if (!miei.length) return;
    const spesa = miei.reduce((t, a) => t + a.prezzo, 0);
    totale += spesa;
    righe.push(`${NOME_RUOLO[r].toUpperCase()} (${miei.length}) — ${spesa} crediti`);
    miei.forEach(a => {
      const g = INDICE[a.id];
      righe.push(`  ${String(a.prezzo).padStart(3)}  ${a.nome}${g ? ' (' + g.s + ')' : ''}`);
    });
    righe.push('');
  });
  const vuote = RUOLI.reduce((t, r) => t + residue(r).length, 0);
  righe.push(`Spesi ${totale} su ${S.budget}. ` +
    (vuote ? `Restano ${vuote} caselle da riempire.` : 'Rosa completa.'));
  return righe.join('\n');
}

async function mostraRiepilogo() {
  const testo = riepilogo();
  let copiato = false;
  try { await navigator.clipboard.writeText(testo); copiato = true; } catch (e) {}
  const d = document.createDocumentFragment();
  d.append(E('h3', '', 'La tua rosa'));
  d.append(E('div', 'prosa', copiato
    ? 'È già negli appunti: incollala dove ti serve.'
    : 'Seleziona e copia il testo qui sotto.'));
  const t = document.createElement('textarea');
  t.className = 'incolla'; t.style.height = '230px'; t.value = testo; t.readOnly = true;
  d.append(t);
  const az = E('div', 'azioni');

  const b1 = E('button', 'btn spento', 'Stampa');
  b1.onclick = () => { chiudi(); setTimeout(() => window.print(), 150); };
  const b2 = E('button', 'btn', 'Chiudi'); b2.onclick = chiudi;
  az.append(b1, b2); d.append(az);

}

async function esporta() {
  const testo = JSON.stringify(S);
  let fatto = false;
  try { await navigator.clipboard.writeText(testo); fatto = true; } catch (e) { fatto = false; }
  const d = document.createDocumentFragment();
  d.append(E('h3', '', fatto ? 'Copiato' : 'Copia a mano'));
  d.append(E('div', 'prosa', fatto
    ? 'Lo stato dell\'asta è negli appunti. Incollalo dove vuoi: se il telefono si blocca, lo rimetti da lì.'
    : 'Seleziona e copia questo testo. È tutta l\'asta.'));
  if (!fatto) {
    const t = document.createElement('textarea');
    t.value = testo;
    t.className = 'incolla';
    d.append(t);
  }
  const az = E('div', 'azioni');
  // Gli appunti si perdono al primo copia-incolla successivo; un file no.
  const b0 = E('button', 'btn primo', 'Salva come file');
  b0.onclick = () => {
    const url = URL.createObjectURL(new Blob([testo], {type: 'application/json'}));
    const a = document.createElement('a');
    a.href = url;
    // "+3" in un nome di file diventa uno spazio quando il browser lo rilegge:
    // il file si chiama per esteso, cosi' resta apribile ovunque.
    a.download = 'piu3-asta-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  };
  const b = E('button', 'btn spento', 'Chiudi'); b.onclick = chiudi;
  az.append(b0, b); d.append(az);
  foglio(d);
}

/* Esportare senza poter reimportare non e' una rete di sicurezza: e' un testo
   che non serve a niente. Si accetta sia il file salvato sia il testo
   incollato, e si controlla che sia davvero uno stato d'asta prima di
   sovrascrivere quello che c'e'. */
function importa() {
  const d = document.createDocumentFragment();
  d.append(E('h3', '', 'Rimetti dentro un\'asta'));
  d.append(E('div', 'prosa', `Incolla qui il testo esportato, o scegli il file. Quello che
    c'è adesso viene sostituito — se non l'hai ancora esportato, fallo prima.`));

  const t = document.createElement('textarea');
  t.placeholder = 'Incolla qui…';
  t.className = 'incolla';
  d.append(t);

  const spia = E('div', 'spia');
  d.append(spia);

  const applica = (testo) => {
    let o;
    try { o = JSON.parse(testo); }
    catch (e) {
      spia.className = 'spia viva';
      spia.textContent = 'Questo testo non è uno stato di +3: non si legge come tale.';
      return;
    }
    if (!o || !Array.isArray(o.miei) || typeof o.venduti !== 'object' || !o.slot) {
      spia.className = 'spia viva';
      spia.textContent = 'Il testo si legge ma non contiene un\'asta: mancano la rosa o le caselle.';
      return;
    }
    ricorda();
    S = Object.assign(S, o);
    if (!S.piano) rigeneraPiano();
    salva(); chiudi(); scheda = 'asta'; disegna();
    avvisa(`Rimessa dentro: <b>${o.miei.length} acquisti</b> e
      <b>${Object.keys(o.venduti).length} prezzi</b> degli altri.`);
  };

  const file = document.createElement('input');
  file.type = 'file'; file.accept = '.json,.txt,application/json,text/plain';
  file.style.display = 'none';
  file.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => applica(String(r.result));
    r.readAsText(f);
  };
  d.append(file);

  const az = E('div', 'azioni');
  const b1 = E('button', 'btn primo', 'Rimetti dentro');
  b1.onclick = () => applica(t.value.trim());
  const b2 = E('button', 'btn spento', 'Scegli un file');
  b2.onclick = () => file.click();
  const b3 = E('button', 'btn spento', 'Lascia stare');
  b3.onclick = chiudi;
  az.append(b1, b2, b3);
  d.append(az);
  foglio(d);
}

/* ---------- 7. listone nuovo senza passare da me ----------
   Le quotazioni cambiano fino al giorno prima dell'asta. Il motore rigenera
   dati_asta.json: caricarlo qui evita di reincollarlo dentro il file a mano. */
function caricaListone() {
  const d = document.createDocumentFragment();
  d.append(E('h3', '', 'Listone aggiornato'));
  d.append(E('div', 'prosa', `Lancia <b>motore.py</b> accanto al Master aggiornato e scegli
    il <b>dati_asta.json</b> che produce. Vale per questa sessione: alla riapertura
    torna quello incorporato nel file. Acquisti e prezzi segnati restano.`));

  const spia = E('div', 'spia');
  d.append(spia);

  const file = document.createElement('input');
  file.type = 'file'; file.accept = '.json,application/json';
  file.style.display = 'none';
  file.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let o;
      try { o = JSON.parse(String(r.result)); } catch (err) { o = null; }
      if (!o || !Array.isArray(o.giocatori) || !o.rotture || !o.giocatori.length) {
        spia.className = 'spia viva';
        spia.textContent = 'Questo non è un dati_asta.json: mancano i giocatori o le fasce.';
        return;
      }
      chiudi();
      // Ricaricare la pagina con i dati nuovi in memoria e' piu' pulito che
      // rattoppare a caldo indici, sigle e ordinamenti gia' calcolati.
      try { sessionStorage.setItem(CHIAVE + ':dati', JSON.stringify(o)); } catch (err) {}
      location.reload();
    };
    r.readAsText(f);
  };
  d.append(file);

  const az = E('div', 'azioni');
  const b1 = E('button', 'btn primo', 'Scegli il file');
  b1.onclick = () => file.click();
  const b2 = E('button', 'btn spento', 'Lascia stare');
  b2.onclick = chiudi;
  az.append(b1, b2);
  d.append(az);
  foglio(d);
}

function azzera() {
  const d = document.createDocumentFragment();
  d.append(E('h3', '', 'Ricominciare da zero'));
  const quanti = S.miei.length, venduti = Object.keys(S.venduti).length;
  d.append(E('div', 'prosa', quanti + venduti === 0
    ? 'Non c\'è ancora niente da cancellare.'
    : `Si cancellano <b>${quanti} acquisti</b> tuoi e <b>${venduti} prezzi</b> segnati
       degli altri. Budget, caselle e regole restano come li hai messi.`));
  const az = E('div', 'azioni');
  const b1 = E('button', 'btn spento', 'Lascia stare'); b1.onclick = chiudi;
  az.append(b1);
  if (quanti + venduti > 0) {
    const b2 = E('button', 'btn pericolo', 'Cancella tutto');
    b2.onclick = () => {
      ricorda();
      S.miei = []; S.venduti = {}; rigeneraPiano(); salva(); chiudi();
      scheda = 'asta'; disegna();
    };
    az.append(b2);
  }
  d.append(az);
  foglio(d);
}

/* ============================================================ AVVIO */
document.querySelectorAll('nav button').forEach(b =>
  b.onclick = () => { scheda = b.dataset.t; window.scrollTo(0, 0); disegna(); });

$('#annulla').onclick = passoIndietro;

ripristina().then(() => {
  // Il permesso di tenere acceso lo schermo va richiesto di nuovo a ogni
  // apertura: non sopravvive alla chiusura della pagina.
  if (S.sveglio) tieniAcceso(true);
  disegna();
});
</script>
