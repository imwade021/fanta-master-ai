name: Esegui Master Engine e Scout

on:
  schedule:
    # Si avvia automaticamente ogni giorno alle 04:00 AM
    - cron: '0 4 * * *'
  workflow_dispatch: # Permette l'avvio manuale dal pannello Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa Librerie
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl

      - name: Esegui Motore e Scout
        env:
          FOOTBALL_API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python build_master.py

      - name: Salva il nuovo File Master su GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add Lista_Finale_Master.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-Update: Lista_Finale_Master.csv aggiornato" && git push)
