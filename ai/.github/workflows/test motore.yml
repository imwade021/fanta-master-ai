name: Esegui Master Engine e Scout

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa Librerie
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl

      - name: Esegui Motore e Scout
        env:
          FOOTBALL_API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          # Piano free: 100 chiamate/giorno. ~22 se ne vanno in squadre e rose,
          # le altre servono alle proiezioni dei nuovi arrivi.
          FANTA_MAX_LOOKUP: '90'
        run: python build_master.py

      - name: Salva il nuovo File Master su GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add -A Lista_Finale_Master.csv scout_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-Update: Lista_Finale_Master.csv aggiornato" && git push)
