<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio">
<link rel="manifest" href="studio.webmanifest">
<link rel="apple-touch-icon" href="icona-180.png">
<title>Studio — l'aspetto di +3</title>
<style>
/* ===========================================================================
   STUDIO

   Non c'e' nessuna copia dell'applicazione da tenere allineata: qui dentro
   gira +3, quello vero, dentro una cornice. Le manopole scrivono le variabili
   dentro quella cornice, quindi quello che vedi non somiglia al risultato:
   e' il risultato.

   Quando salvi, i valori finiscono nella stessa memoria che legge
   l'applicazione. Torni su +3 e sono gia' li'. Niente da copiare, niente da
   incollare, niente da mandare a nessuno.
   =========================================================================== */
:root{
  --s-fondo:#0a0d12; --s-carta:#151b25; --s-linea:#28323f;
  --s-testo:#e9ecf1; --s-fioco:#93a0b0; --s-vivo:#4da3ff;
  --alto:52vh; --colonna:390px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--s-fondo);color:var(--s-testo);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-touch-callout:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;
  touch-action:manipulation}
input,select{font:inherit;color:inherit;font-size:16px}

/* ---------- l'applicazione vera ---------- */
#palco{position:fixed;top:0;left:0;right:0;height:var(--alto);background:#0b2716;
  display:flex;align-items:stretch;justify-content:center}
#app{width:100%;max-width:var(--largo,100%);height:100%;border:none;display:block;
  background:#0b2716}
#assente{position:absolute;inset:0;display:none;align-items:center;
  justify-content:center;padding:22px;text-align:center;font-size:13.5px;
  line-height:1.6;color:#cfe0d5;background:#0b2716}
#assente b{color:#fff}

/* ---------- i comandi ---------- */
#banco{position:fixed;left:0;right:0;bottom:0;top:var(--alto);z-index:10;
  background:var(--s-carta);border-top:1px solid var(--s-linea);
  border-radius:16px 16px 0 0;display:flex;flex-direction:column;
  box-shadow:0 -8px 30px rgba(0,0,0,.5)}
#presa{padding:8px 0 5px;display:flex;justify-content:center;flex:none;touch-action:none}
#presa i{width:40px;height:4px;border-radius:3px;background:#475466}

#guasto{display:none;margin:0 14px 10px;padding:10px 12px;border-radius:10px;
  font-family:ui-monospace,monospace;font-size:12px;line-height:1.5;color:#ffb4a2;
  background:rgba(224,108,91,.14);border:1px solid rgba(224,108,91,.45);
  user-select:text;-webkit-user-select:text}

#capo{display:flex;align-items:center;gap:10px;padding:0 14px 9px;flex:none}
#capo h1{margin:0;font-size:16px;font-weight:700;flex:1}
#capo h1 small{display:block;font-size:11.5px;font-weight:400;color:var(--s-fioco);
  margin-top:3px;line-height:1.35}
#torna{padding:9px 15px;border-radius:10px;background:var(--s-vivo);color:#06121f;
  font-size:13px;font-weight:600;min-height:42px}

#schermi{display:none;gap:6px;padding:0 14px 10px}
#schermi button{flex:1;padding:9px 4px;border-radius:9px;font-size:11.5px;
  background:#1d2531;border:1px solid var(--s-linea);color:var(--s-fioco);min-height:38px}
#schermi button.on{background:#2b3849;color:#fff;border-color:#3f4e63}

#pezzi{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;flex:none;
  scrollbar-width:none}
#pezzi::-webkit-scrollbar{display:none}
#pezzi button{padding:9px 14px;border-radius:18px;font-size:12.5px;white-space:nowrap;
  background:#1d2531;border:1px solid var(--s-linea);color:var(--s-fioco);min-height:42px}
#pezzi button.on{background:var(--s-vivo);color:#06121f;border-color:var(--s-vivo);
  font-weight:600}

#comandi{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 14px calc(76px + env(safe-area-inset-bottom))}
.voce{display:flex;align-items:center;gap:11px;padding:11px 0;
  border-bottom:1px solid #1f2733;min-height:58px}
.voce:last-child{border-bottom:none}
.voce .nome{flex:1;font-size:13.5px;line-height:1.3}
.voce .nome small{display:block;color:#6f7b8a;font-size:11px;margin-top:3px;line-height:1.4}
.voce input[type=color]{width:54px;height:40px;padding:0;border:1px solid #333f4d;
  border-radius:9px;background:none;flex:none}
.voce input[type=range]{width:126px;flex:none;accent-color:var(--s-vivo);height:36px}
.voce select{background:#1d2531;border:1px solid #333f4d;border-radius:9px;
  padding:10px 9px;flex:none;max-width:158px}
.voce .val{font-family:ui-monospace,monospace;font-size:11.5px;color:#78849a;
  min-width:42px;text-align:right;flex:none}

#piede{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:8px;
  padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  background:rgba(15,20,28,.97);border-top:1px solid var(--s-linea)}
#piede button{padding:13px 6px;border-radius:11px;font-size:13px;font-weight:600;
  border:1px solid #333f4d;background:#1d2531;min-height:48px;flex:1}
#piede button.primo{background:var(--s-vivo);border-color:var(--s-vivo);color:#06121f;flex:2}

@media (min-width:760px){
  #palco{right:var(--colonna);height:100vh}
  #banco{top:0;left:auto;width:var(--colonna);border-radius:0;border-top:none;
    border-left:1px solid var(--s-linea);box-shadow:-8px 0 30px rgba(0,0,0,.4)}
  #presa{display:none}
  #capo{padding-top:16px}
  #piede{left:auto;width:var(--colonna)}
  #schermi{display:flex}
}
</style>
</head>
<body>

<div id="palco">
  <iframe id="app" src="astanote.html" title="+3"></iframe>
  <div id="assente">
    <div><b>Non riesco a caricare +3.</b><br>
    Lo Studio e l'applicazione devono stare nella stessa cartella:
    <b>astanote.html</b> accanto a <b>studio.html</b>.</div>
  </div>
</div>

<div id="banco">
  <div id="presa"><i></i></div>
  <div id="guasto"></div>
  <div id="capo">
    <h1 id="titolo"></h1>
    <button id="torna">Vai a +3</button>
  </div>
  <div id="schermi">
    <button data-largo="420px" class="on">Telefono</button>
    <button data-largo="820px">iPad</button>
    <button data-largo="100%">Pieno</button>
  </div>
  <div id="pezzi"></div>
  <div id="comandi"></div>
</div>

<div id="piede">
  <button class="primo" id="applica">Tieni questo aspetto</button>
  <button id="rimetti">Rimetti</button>
</div>

<script>
"use strict";

/* Se qualcosa si rompe qui dentro, chi usa il file deve poterlo leggere:
   un pannello vuoto senza spiegazione fa perdere una serata. */
window.addEventListener('error', e => {
  const b = document.getElementById('guasto');
  if (!b) return;
  b.style.display = 'block';
  b.textContent = 'Errore: ' + e.message + ' — riga ' + e.lineno + ':' + e.colno;
});

/* ---------------------------------------------------------------- manopole */
const M = {
  'erba-a':{t:'colore', n:'Erba, striscia chiara'},
  'erba-b':{t:'colore', n:'Erba, striscia scura'},
  'erba-passo':{t:'px', n:'Larghezza delle strisce', min:8, max:90},
  'righe-opacita':{t:'frazione', n:'Quanto si vedono le righe del campo', min:0, max:1},
  'righe-campo':{t:'colore', n:'Righe dentro il riquadro bianco'},
  'fondo':{t:'colore', n:"Fondo sotto l'erba"},

  'chrome':{t:'colore', n:'Fondo della testata', d:'lo stesso della barra in basso'},
  'carta':{t:'colore', n:'Fondo dei pannelli'},
  'rilievo':{t:'colore', n:'Riquadri interni', d:'caselle, campi, riquadri dei fatti'},
  'linea':{t:'colore', n:'Bordi e separatori'},
  'raggio':{t:'px', n:'Angoli dei pannelli', min:0, max:28},
  'bordo-pannello':{t:'px', n:'Spessore del bordo', min:0, max:3},
  'ombra':{t:'scelta', n:'Ombra sotto i pannelli',
    o:[['none','nessuna'],['0 1px 6px rgba(0,0,0,.16)','leggera'],
       ['0 2px 14px rgba(0,0,0,.22)','media'],['0 6px 26px rgba(0,0,0,.36)','marcata']]},

  'testo':{t:'colore', n:'Testo principale'},
  'fioco':{t:'colore', n:'Testo secondario'},
  'tenue':{t:'colore', n:'Testo tenue', d:'le etichette piccole'},
  'testo-corpo':{t:'px', n:'Dimensione del testo', min:13, max:19},

  'numero-colore':{t:'colore', n:'Colore del numero grande'},
  'numero-corpo':{t:'px', n:'Dimensione', min:34, max:96},
  'numero-peso':{t:'scelta', n:'Spessore',
    o:[['400','normale'],['600','medio'],['700','grassetto'],['800','molto grassetto']]},
  'bagliore':{t:'px', n:'Bagliore', min:0, max:30},

  'nome-corpo':{t:'px', n:'Dimensione dei nomi', min:12, max:20},
  'nome-peso':{t:'scelta', n:'Spessore dei nomi',
    o:[['400','normale'],['600','medio'],['700','grassetto']]},
  'aria':{t:'px', n:'Aria fra le righe', min:0, max:10},
  'capello':{t:'scelta', n:'Separatori',
    o:[['0.5px','a capello'],['1px','normali'],['2px','marcati']]},
  'raggio-etichetta':{t:'px', n:'Angoli delle etichette', min:0, max:14},

  'oro':{t:'colore', n:'Accento', d:'prezzi, etichette di fascia'},
  'allarme':{t:'colore', n:'Allarme', d:'infortunati, cancellazioni'},
  'verde':{t:'colore', n:'Buono', d:'occasioni, caselle riempite'},
  'acqua':{t:'colore', n:'Informazione'},

  'oro-pieno':{t:'colore', n:'Fondo del pulsante principale'},
  'su-oro':{t:'colore', n:'Testo sul pulsante principale'},
  'raggio-pulsante':{t:'px', n:'Angoli dei pulsanti', min:0, max:26},

  'nav-attivo':{t:'colore', n:'Scheda attiva'},
  'nav-spento':{t:'colore', n:'Schede spente'},

  'vetro':{t:'percento', n:'Quanto sono trasparenti i pannelli', min:0, max:60,
    d:'alzandolo si vede il campo attraverso la carta'},
  'sfocatura':{t:'px', n:'Quanto sfoca quello che filtra', min:0, max:40},
  'saturazione':{t:'percento', n:'Vivacità di quello che filtra', min:100, max:260,
    d:'senza, il verde che passa diventa grigio e sembra sporco'},
  'grana':{t:'frazione', n:'Grana', min:0, max:.35,
    d:"toglie l'aria di sfondo generato al computer"},
  'vignetta':{t:'frazione', n:'Vignettatura', min:0, max:.7},
};

const PEZZI = [
  {id:'sfondo',   nome:'Sfondo',   sotto:"l'erba e le righe del campo",
   c:['erba-a','erba-b','erba-passo','righe-opacita','righe-campo','fondo']},
  {id:'pannelli', nome:'Pannelli', sotto:'i fogli e la testata',
   c:['chrome','carta','rilievo','linea','raggio','bordo-pannello','ombra']},
  {id:'testi',    nome:'Testi',    sotto:'le spiegazioni e le etichette',
   c:['testo','fioco','tenue','testo-corpo']},
  {id:'numero',   nome:'Numero',   sotto:'la cifra grande dei crediti',
   c:['numero-colore','numero-corpo','numero-peso','bagliore']},
  {id:'righe',    nome:'Righe',    sotto:'i giocatori del listone',
   c:['nome-corpo','nome-peso','aria','capello','raggio-etichetta',
      'oro','allarme','verde','acqua']},
  {id:'pulsanti', nome:'Pulsanti', sotto:'i comandi di conferma',
   c:['oro-pieno','su-oro','raggio-pulsante']},
  {id:'schede',   nome:'Schede',   sotto:'la barra in fondo',
   c:['nav-attivo','nav-spento','chrome']},
  {id:'materiale',nome:'Materiale',sotto:'vetro, grana, vignettatura',
   c:['vetro','sfocatura','saturazione','grana','vignetta']},
];

/* La stessa chiave che legge l'applicazione. E' tutto il collegamento fra i
   due file: nessun testo da copiare, nessun travaso. */
const CHIAVE = 'banco:stato:v1:aspetto';
const $ = s => document.querySelector(s);
let scelto = 'sfondo', ospite = null, base = {}, ritocchi = {};

function tema() {
  try {
    const s = JSON.parse(localStorage.getItem('banco:stato:v1') || 'null');
    return (s && s.tema === 'scuro') ? 'scuro' : 'campo';
  } catch (e) { return 'campo'; }
}

/* Legge la variabile dentro l'applicazione, non da qui: i valori di partenza
   sono i suoi, non i miei. */
const leggi = k => ospite
  ? ospite.getComputedStyle(ospite.document.documentElement)
      .getPropertyValue('--' + k).trim()
  : '';
const scrivi = (k, v) => {
  if (ospite) ospite.document.documentElement.style.setProperty('--' + k, v);
  ritocchi[k] = v;
};

function collega() {
  const frame = $('#app');
  try {
    ospite = frame.contentWindow;
    if (!ospite || !ospite.document || !ospite.document.documentElement) throw 0;
  } catch (e) {
    $('#assente').style.display = 'flex';
    return;
  }
  // com'era prima di toccare niente: serve a "Rimetti"
  base = {};
  Object.keys(M).forEach(k => base[k] = leggi(k));
  const salvati = memoria()[tema()];
  if (salvati) { ritocchi = Object.assign({}, salvati);
                 Object.entries(ritocchi).forEach(([k, v]) => scrivi(k, v)); }
  disegnaPezzi();
  disegnaComandi();
}

function memoria() {
  try { return JSON.parse(localStorage.getItem(CHIAVE) || '{}') || {}; }
  catch (e) { return {}; }
}

/* ---------------------------------------------------------------- comandi */
function disegnaPezzi() {
  const box = $('#pezzi');
  box.innerHTML = '';
  PEZZI.forEach(p => {
    const b = document.createElement('button');
    b.textContent = p.nome;
    if (p.id === scelto) b.className = 'on';
    b.onclick = () => { scelto = p.id; disegnaPezzi(); disegnaComandi(); };
    box.append(b);
  });
}

function disegnaComandi() {
  const p = PEZZI.find(x => x.id === scelto);
  $('#titolo').innerHTML = p.nome + '<small>' + p.sotto + '</small>';
  const box = $('#comandi');
  box.innerHTML = '';
  p.c.forEach(k => {
    const c = M[k];
    const riga = document.createElement('div');
    riga.className = 'voce';
    const et = document.createElement('div');
    et.className = 'nome';
    et.innerHTML = c.n + (c.d ? '<small>' + c.d + '</small>' : '');
    riga.append(et);
    const ora = leggi(k);

    if (c.t === 'colore') {
      const i = document.createElement('input');
      i.type = 'color'; i.value = esadecimale(ora);
      i.oninput = () => scrivi(k, i.value);
      riga.append(i);

    } else if (c.t === 'scelta') {
      const sel = document.createElement('select');
      c.o.forEach(([v, et2]) => {
        const o = document.createElement('option');
        o.value = v; o.textContent = et2;
        o.selected = v.replace(/["']/g, '') === ora.replace(/["']/g, '');
        sel.append(o);
      });
      sel.onchange = () => scrivi(k, sel.value);
      riga.append(sel);

    } else {
      const unita = c.t === 'px' ? 'px' : c.t === 'percento' ? '%' : '';
      const i = document.createElement('input');
      i.type = 'range'; i.min = c.min; i.max = c.max;
      i.step = c.t === 'frazione' ? 0.01 : 1;
      i.value = parseFloat(ora) || 0;
      const val = document.createElement('div');
      val.className = 'val';
      const mostra = () => val.textContent = c.t === 'frazione'
        ? Math.round(i.value * 100) + '%' : i.value + unita;
      i.oninput = () => { scrivi(k, i.value + unita); mostra(); };
      mostra();
      riga.append(i, val);
    }
    box.append(riga);
  });
}

/* Il selettore di colore del telefono accetta solo #rrggbb. */
function esadecimale(col) {
  col = (col || '').trim();
  if (/^#[0-9a-f]{6}$/i.test(col)) return col;
  if (/^#[0-9a-f]{3}$/i.test(col))
    return '#' + col.slice(1).split('').map(x => x + x).join('');
  const m = col.match(/rgba?\((\d+)[,\s]+(\d+)[,\s]+(\d+)/i);
  if (m) return '#' + [1,2,3].map(i => (+m[i]).toString(16).padStart(2, '0')).join('');
  return '#888888';
}

/* ---------------------------------------------------------------- consegna */
$('#applica').onclick = () => {
  const tutto = memoria();
  tutto[tema()] = ritocchi;
  // l'elenco dei nomi serve all'applicazione per azzerare prima di riapplicare
  tutto.chiavi = Object.keys(M);
  try { localStorage.setItem(CHIAVE, JSON.stringify(tutto)); } catch (e) {}
  const b = $('#applica');
  b.textContent = 'Fatto — è su +3';
  setTimeout(() => b.textContent = 'Tieni questo aspetto', 1600);
};

$('#rimetti').onclick = () => {
  ritocchi = {};
  if (ospite) Object.keys(M).forEach(k =>
    ospite.document.documentElement.style.removeProperty('--' + k));
  const tutto = memoria();
  delete tutto[tema()];
  try { localStorage.setItem(CHIAVE, JSON.stringify(tutto)); } catch (e) {}
  disegnaComandi();
};

$('#torna').onclick = () => { location.href = 'astanote.html'; };

document.querySelectorAll('#schermi button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#schermi button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    document.documentElement.style.setProperty('--largo', b.dataset.largo);
  };
});

/* La riga fra le due meta' si trascina. */
(() => {
  const presa = $('#presa');
  let da = null, alto0 = 0;
  presa.addEventListener('pointerdown', e => {
    da = e.clientY;
    alto0 = window.innerHeight *
      parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--alto')) / 100;
    presa.setPointerCapture(e.pointerId);
  });
  presa.addEventListener('pointermove', e => {
    if (da === null) return;
    const px = Math.min(window.innerHeight * 0.78,
               Math.max(window.innerHeight * 0.22, alto0 + (e.clientY - da)));
    document.documentElement.style.setProperty('--alto',
      (px / window.innerHeight * 100).toFixed(1) + 'vh');
  });
  ['pointerup', 'pointercancel'].forEach(ev =>
    presa.addEventListener(ev, () => { da = null; }));
})();

$('#app').addEventListener('load', collega);
$('#app').addEventListener('error', () => { $('#assente').style.display = 'flex'; });
disegnaPezzi();
disegnaComandi();

if ('serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
